<div
  class="tw:bg-white tw:rounded-2xl tw:p-4 tw:shadow-sm tw:flex tw:flex-col tw:border tw:border-gray-100"
>
  <div class="tw:flex tw:justify-between tw:items-start tw:mb-3">
    <div class="tw:flex tw:flex-col tw:gap-1 tw:flex-1">
      <h4
        class="tw:text-base tw:font-semibold tw:text-gray-900 tw:leading-tight"
      >
        {{ label() }}
      </h4>
      @if (subLabel(); as sub) {
        <p class="tw:text-sm tw:text-gray-500">{{ sub }}</p>
      }
      @if (isMostVoted() && !hideResults()) {
        <p-tag
          [value]="'project.votesOverview.mostVotes' | translate"
          icon="fa-solid fa-trophy"
        />
      }
    </div>
    <div class="tw:flex tw:flex-col tw:items-center tw:shrink-0 tw:ml-3">
      <i
        class="fa-regular"
        [ngClass]="[voteIcon(option().choice), voteColorClass(option().choice)]"
        style="font-size: 22px"
      ></i>
      <span
        class="tw:text-xs tw:font-medium tw:mt-0.5"
        [ngClass]="voteColorClass(option().choice)"
        >{{ voteLabel(option().choice) }}</span
      >
    </div>
  </div>

  @if (!hideResults()) {
    <div class="tw:flex tw:items-center tw:gap-2 tw:mb-3">
      <i
        class="fa-solid fa-users tw:text-gray-400"
        style="font-size: 13px"
      ></i>
      <span class="tw:text-xs tw:text-gray-500">
        {{ votesCountLabel() }}
      </span>
    </div>
  }

  @if (option().choice) {
    <div class="tw:flex tw:justify-end">
      <p-button
        [label]="'project.votesOverview.reVote' | translate"
        icon="fa-solid fa-rotate"
        severity="secondary"
        variant="text"
        size="small"
        [routerLink]="[
          '/project/detail',
          projectId(),
          'vote',
          pollId(),
          option().id,
        ]"
      />
    </div>
  } @else {
    <p-button
      [label]="'project.common.vote' | translate"
      icon="fa-solid fa-play"
      [routerLink]="[
        '/project/detail',
        projectId(),
        'vote',
        pollId(),
        option().id,
      ]"
      styleClass="tw:w-full"
    />
  }
</div>
