<p class="label mb-2">{{ 'project.share.personInvite' | translate }}</p>

<div class="relative">
  <div class="flex gap-2">
    <input
      hlmInput
      type="email"
      autocomplete="off"
      [ngModel]="contactEmail()"
      (ngModelChange)="onEmailInput($event)"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [disabled]="sharingInProgress()"
      class="flex-1 !bg-white"
    />
    <button
      hlmBtn
      size="icon"
      [disabled]="!contactEmail()"
      [loading]="sharingInProgress()"
      (click)="invite()"
      title="Einladen"
    >
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

  @if (dropdownVisible() && filteredContacts().length > 0) {
    <div class="absolute top-full left-0 right-0 z-20 mt-1 rounded-[var(--radius-xl)] overflow-hidden border border-[var(--border-hairline-soft)] bg-white shadow-lg">
      @for (c of filteredContacts(); track c.email) {
        <button
          class="flex w-full items-center gap-3 px-4 py-2.5 text-left transition-colors hover:bg-[var(--sand-100)]"
          (click)="selectContact(c)"
          type="button"
        >
          <span
            class="flex size-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
            style="background: var(--accent-tint); color: var(--accent)"
          >
            {{ c.name[0]?.toUpperCase() }}
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium">{{ c.name }}</p>
            <p class="truncate text-xs text-[var(--text-muted)]">{{ c.email }}</p>
          </div>
        </button>
      }
    </div>
  }
</div>

<p class="label mt-5 mb-2">{{ 'project.share.roleLabel' | translate }}</p>

<hlm-toggle-group
  type="single"
  [nullable]="false"
  [value]="selectedRole()"
  (valueChange)="onRoleChange($event)"
  variant="outline"
  class="w-full"
>
  @for (opt of roleOptions(); track opt.id) {
    <button hlmToggleGroupItem [value]="opt.id" class="flex-1 text-xs">
      {{ opt.label }}
    </button>
  }
</hlm-toggle-group>

<p class="mt-1.5 text-xs text-[var(--text-secondary)]">{{ selectedRoleDescription() }}</p>
