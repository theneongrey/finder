<button
    hlmBtn
    type="button"
    class="inline-flex h-[34px]! cursor-pointer items-center gap-1.5 rounded-full! px-[13px]! [font-family:var(--font-body)] font-bold! whitespace-nowrap text-[var(--fs-ui-sm)]! active:scale-[0.96]"
    [class]="stateClass()"
    [attr.aria-pressed]="active()"
    (click)="toggle()"
>
    @if (icon()) {
        <span
            class="contents"
            [class]="active() ? 'opacity-100' : 'opacity-[0.35]'"
        >
            <ds-icon [name]="icon()!" [size]="14" />
        </span>
    }
    {{ label() }}
</button>
