<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-app);font-family:var(--font-body);padding:20px;color:var(--text-primary);}
.tile{border:1.5px dashed var(--sand-500);background:rgba(255,255,255,.4);border-radius:18px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:9px;width:120px;}
.row{display:flex;gap:10px;}
</style>
</head>
<body>

<div class="row" style="margin-bottom:20px;">
  <div class="tile">
    <span style="width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
    </span>
    <span style="font-size:13px;font-weight:700;">Termin</span>
  </div>
  <div class="tile">
    <span style="width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect><path d="M8 12.3l2.7 2.7L16.4 9"></path></svg>
    </span>
    <span style="font-size:13px;font-weight:700;">Ja/Nein</span>
  </div>
  <div class="tile">
    <span style="width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:19px;">★</span>
    <span style="font-size:13px;font-weight:700;">Bewertung</span>
  </div>
</div>

<div style="width:100%;max-width:420px;border:1.5px dashed var(--sand-500);background:rgba(255,255,255,.4);border-radius:22px;padding:24px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-600);font-size:15px;font-weight:700;margin-bottom:24px;">
  <span style="width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1;font-weight:500;">+</span>
  Neues Projekt starten
</div>

<div class="row" style="align-items:center;justify-content:center;max-width:420px;">
  <button style="width:60px;height:60px;border-radius:50%;border:2px solid var(--red-200);background:var(--red-100);color:var(--red-700);display:flex;align-items:center;justify-content:center;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
  </button>
  <span style="color:var(--accent);font-size:15px;font-weight:700;margin:0 20px;">Überspringen</span>
  <button style="width:60px;height:60px;border-radius:50%;border:2px solid var(--teal-300);background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3s-7.5-4.6-9.7-9C.8 8 2 4.7 5 3.7c2.2-.7 4.3.2 5.6 2 .4.5 1 1.4 1.4 1.4s1-.9 1.4-1.4c1.3-1.8 3.4-2.7 5.6-2 3 1 4.2 4.3 2.7 7.6-2.2 4.4-9.7 9-9.7 9z"></path></svg>
  </button>
</div>

</body>
</html>
