<div class="tw:flex tw:flex-col tw:gap-3">
  <span class="tw:text-sm tw:font-semibold tw:px-1">
    {{ "project.pollInput.date.appointmentTypeLabel" | translate }}
  </span>

  @if (selectedType() && !isEditing()) {
    <div
      class="tw:flex tw:items-center tw:gap-3 tw:px-3 tw:py-2.5 tw:rounded-xl tw:border tw:border-gray-200 tw:bg-white"
    >
      <i
        class="{{
          selectedTypeInfo()!.icon
        }} tw:text-primary tw:text-lg tw:w-5 tw:text-center"
      ></i>
      <span class="tw:text-sm tw:font-medium tw:text-gray-700 tw:flex-1">
        {{ selectedTypeInfo()!.labelKey | translate }}
      </span>
      <button
        type="button"
        class="tw:text-sm tw:text-white tw:bg-primary tw:cursor-pointer tw:border-0 tw:px-3 tw:py-1 tw:rounded-lg hover:tw:opacity-80 tw:transition-opacity"
        (click)="isEditing.set(true)"
      >
        {{ "project.pollInput.date.changeType" | translate }}
      </button>
    </div>
  } @else {
    <div class="tw:grid tw:grid-cols-3 tw:gap-2">
      @for (t of types; track t.type) {
        <button
          type="button"
          [class]="
            t.type === selectedType()
              ? 'tw:flex tw:flex-col tw:items-center tw:gap-2 tw:p-4 tw:rounded-xl tw:border tw:border-primary bg-app-gradient tw:cursor-pointer tw:transition-colors tw:text-primary tw:text-sm tw:font-medium'
              : 'tw:flex tw:flex-col tw:items-center tw:gap-2 tw:p-4 tw:rounded-xl tw:border tw:border-gray-200 tw:bg-white tw:cursor-pointer hover:tw:border-primary hover:tw:text-primary tw:transition-colors tw:text-gray-600 tw:text-sm tw:font-medium'
          "
          (click)="onTypeClick(t.type)"
        >
          <i class="{{ t.icon }} tw:text-xl"></i>
          {{ t.labelKey | translate }}
        </button>
      }
    </div>
  }
</div>
