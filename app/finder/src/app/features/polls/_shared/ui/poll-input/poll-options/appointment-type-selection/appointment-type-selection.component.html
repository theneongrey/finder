<ds-card [accentBorder]="false" [padding]="16">
  <p class="label text-[color:var(--text-muted)] tracking-[var(--tracking-eyebrow-lg)]">
    {{ 'project.pollInput.date.appointmentTypeLabel' | translate }}
  </p>
  <div class="flex flex-wrap gap-[7px] py-px mt-[11px]">
    @for (t of types; track t.type) {
      <ds-button
        size="sm"
        [variant]="t.type === selectedType() ? 'soft' : 'neutral'"
        [attr.data-testid]="'appt-type-' + t.type"
        (click)="typeSelected.emit(t.type)"
      >
        @if (t.type === selectedType()) {
          <span class="w-[7px] h-[7px] rounded-full bg-[var(--accent)] flex-none"></span>
        }
        {{ t.labelKey | translate }}
      </ds-button>
    }
  </div>

  @if (canHaveTime()) {
    <button
      type="button"
      class="flex items-center gap-3 w-full text-left cursor-pointer mt-[10px] px-[14px] py-3 rounded-[14px] border border-[rgba(20,24,28,.06)] bg-[#fdfcfa]"
      (click)="showTimeChange.emit(!showTime())"
    >
      <span class="flex-1 min-w-0">
        <span class="block text-[14px] font-bold text-[color:var(--text-primary)]">
          {{ 'project.pollInput.date.timePerOption' | translate }}
        </span>
        <span class="block text-[12.5px] mt-0.5 text-[color:var(--text-muted)]">
          {{ 'project.pollInput.date.timePerOptionHint' | translate }}
        </span>
      </span>
      <span
        class="relative flex-none w-11 h-[26px] rounded-full transition-[background] duration-[180ms]"
        [class.bg-[var(--accent)]]="showTime()"
        [class.bg-[var(--sand-500)]]="!showTime()"
      >
        <span
          class="absolute top-[3px] w-5 h-5 rounded-full bg-white shadow-[0_1px_4px_rgba(30,35,40,.28)] transition-[left] duration-200"
          [class.left-[21px]]="showTime()"
          [class.left-[3px]]="!showTime()"
        ></span>
      </span>
    </button>
  }
</ds-card>
