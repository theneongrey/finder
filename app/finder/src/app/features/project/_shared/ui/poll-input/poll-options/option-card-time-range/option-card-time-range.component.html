<div hlmCard>
  <div hlmCardContent>
  <div class="flex items-start gap-2">
    <div class="flex flex-col gap-2 flex-1">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-600">
          {{ "project.pollInput.date.startTime" | translate }}
        </label>
        <p-datepicker
          [timeOnly]="true"
          hourFormat="24"
          [showIcon]="true"
          [stepMinute]="15"
          appendTo="body"
          styleClass="w-full"
          [(ngModel)]="option().startTime"
          [name]="'time-range-start-' + index()"
          (ngModelChange)="onStartTimeChange()"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-600">
          {{ "project.pollInput.date.endTime" | translate }}
        </label>
        <p-datepicker
          [timeOnly]="true"
          hourFormat="24"
          [showIcon]="true"
          [stepMinute]="15"
          appendTo="body"
          styleClass="w-full"
          [(ngModel)]="option().endTime"
          [name]="'time-range-end-' + index()"
        />
      </div>
    </div>

    @if (canRemove()) {
      <p-button
        type="button"
        icon="fa-solid fa-xmark"
        [text]="true"
        severity="secondary"
        (click)="remove.emit()"
      />
    }
  </div>
  </div>
</div>
