<div
  class="bg-white rounded-2xl p-4 ds-shadow-card flex flex-col border border-gray-100"
>
  <div class="flex justify-between items-start mb-3">
    <div class="flex gap-3">
      <div class="flex flex-col gap-1">
        <h4
          class="text-base font-semibold text-gray-900 leading-tight"
        >
          {{ option().text }}
        </h4>
        @if (option().description) {
          <p class="text-sm text-gray-500">
            {{ option().description }}
          </p>
        }
        @if (isMostVoted() && !hideResults()) {
          <span hlmBadge>
            <i class="fa-solid fa-trophy mr-1"></i>{{ 'project.votesOverview.mostVotes' | translate }}
          </span>
        }
      </div>
    </div>
    <div class="flex flex-col items-center shrink-0 ml-3">
      <i
        class="fa-regular"
        [ngClass]="[voteIcon(option().choice), voteColorClass(option().choice)]"
        style="font-size: 22px"
      ></i>
      <span
        class="text-xs font-medium mt-0.5"
        [ngClass]="voteColorClass(option().choice)"
        >{{ voteLabel(option().choice) }}</span
      >
    </div>
  </div>

  @if (!hideResults()) {
    <div class="flex items-center gap-2 mb-3">
      <i
        class="fa-solid fa-users text-gray-400 text"
        style="font-size: 13px"
      ></i>
      <span class="text-xs text-gray-500">
        {{ votesCountLabel() }}
      </span>
    </div>
  }

  @if (option().choice) {
    <div class="flex justify-end">
      <button hlmBtn variant="ghost" size="sm" [routerLink]="[
          '/project/detail',
          projectId(),
          'vote',
          pollId(),
          option().id,
        ]"><i class="fa-solid fa-rotate"></i>{{ 'project.votesOverview.reVote' | translate }}</button>
    </div>
  } @else {
    <button hlmBtn class="w-full" [routerLink]="[
        '/project/detail',
        projectId(),
        'vote',
        pollId(),
        option().id,
      ]"><i class="fa-solid fa-play"></i>{{ 'project.common.vote' | translate }}</button>
  }
</div>
