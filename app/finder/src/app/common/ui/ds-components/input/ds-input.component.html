<div class="flex w-full flex-col gap-1.5">
    @if (label()) {
        <label
            class="[font-family:var(--font-body)] text-[length:var(--fs-ui-sm)] font-semibold text-[var(--text-secondary)]"
            >{{ label() }}</label
        >
    }
    <div class="relative w-full">
        <input
            #inputEl
            hlmInput
            [type]="type()"
            [value]="value()"
            [placeholder]="placeholder()"
            [disabled]="isDisabled() || loading()"
            [readOnly]="readonly()"
            [style.background]="background()"
            [class.ds-input--error]="!!error() || invalid()"
            [class.ds-input--has-affix]="loading() || showClear()"
            [attr.aria-invalid]="!!error() || invalid() || null"
            [attr.title]="title() ?? null"
            [attr.maxlength]="maxlength() ?? null"
            [class.ds-input--readonly]="readonly()"
            class="ds-input"
            (input)="handleInput($event)"
            (blur)="handleBlur()"
        />
        @if (loading()) {
            <div class="ds-input-spinner" aria-hidden="true"></div>
        } @else if (showClear()) {
            <button
                type="button"
                class="absolute top-1/2 right-2 flex h-6 w-6 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border-none bg-transparent p-0 text-[var(--text-muted)] transition-[background,color] duration-[var(--duration-fast)] ease-[var(--ease-standard)] hover:bg-[var(--sand-100)] hover:text-[var(--text-secondary)]"
                tabindex="-1"
                aria-label="Clear"
                (click)="clear()"
            >
                <ds-icon name="close" [size]="14" />
            </button>
        }
    </div>
    @if (error()) {
        <span
            class="text-[length:var(--fs-caption-sm)] text-[var(--negative)]"
            >{{ error() }}</span
        >
    }
</div>
