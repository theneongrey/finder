@if (standalonePolls().length === 0) {
  <p data-testid="polls-empty-state" class="mb-4 opacity-60">
    {{ "project.pollsTab.empty" | translate }}
  </p>
}

<div data-testid="polls-list" data-vt-stagger class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-8">
  @for (poll of standalonePolls(); track poll.pollId) {
    <app-poll-item
      [poll]="poll"
      (deletionRequested)="deletionRequested.emit(poll)"
      (shareRequested)="shareRequested.emit(poll.projectId)"
      (favoriteToggled)="projectListStore.toggleFavorite($event)"
    />
  }
</div>
