<div>
    <div
        [class]="
            layout() === 'grid'
                ? 'mt-0 grid max-w-[940px] grid-cols-3 gap-4'
                : 'mt-0 grid grid-cols-1 gap-3'
        "
    >
        @for (pt of pollTypes; track pt.type) {
            <app-poll-type-button
                [type]="pt.type"
                [selectedType]="selectedType()"
                [layout]="layout()"
                [iconName]="pt.iconName"
                [iconBg]="pt.iconBg"
                [iconColor]="pt.iconColor"
                [nameKey]="pt.nameKey"
                [descKey]="pt.descKey"
                [testId]="pt.testId"
                (typeSelected)="typeSelected.emit($event)"
            />
        }
    </div>
</div>
