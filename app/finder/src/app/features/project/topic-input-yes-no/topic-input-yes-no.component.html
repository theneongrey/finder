<div class="tw:flex tw:flex-col tw:gap-6 tw:mx-4 tw:pb-28">
  <!-- Your question -->
  <div class="tw:flex tw:flex-col tw:gap-1">
    <label class="tw:text-sm tw:font-semibold tw:px-1" for="question">
      Your question
    </label>
    <div
      class="tw:bg-gray-50 tw:rounded-xl tw:py-4 tw:border tw:border-transparent tw:transition-all tw:duration-300"
    >
      <input
        pInputText
        id="question"
        name="question"
        class="tw:w-full tw:bg-transparent"
        autocomplete="off"
        placeholder="Which couch color fits best?"
        [ngModel]="question()"
        (ngModelChange)="question.set($event)"
      />
    </div>
  </div>

  <!-- Answer options -->
  <div class="tw:flex tw:flex-col tw:gap-2">
    <div class="tw:flex tw:justify-between tw:items-center tw:px-1">
      <span class="tw:text-sm tw:font-semibold"> Answer options </span>
      <span class="tw:text-xs tw:text-neutral">Min. 1 option</span>
    </div>

    <div class="tw:flex tw:flex-col tw:gap-3">
      @for (option of options(); track $index) {
        <app-side-color-card [color]="'primary'">
          <div class="tw:flex tw:flex-col tw:gap-3">
            <div class="tw:flex tw:items-center tw:gap-2">
              <input
                pInputText
                class="tw:flex-1 tw:bg-gray-50 tw:rounded-lg"
                [placeholder]="'Option ' + ($index + 1)"
                [(ngModel)]="option.text"
                [name]="'option-text-' + $index"
              />
              @if (options().length > 1) {
                <p-button
                  type="button"
                  icon="pi pi-times"
                  [text]="true"
                  severity="secondary"
                  (click)="removeOption($index)"
                />
              }
            </div>
            <div class="tw:flex tw:items-center tw:gap-2">
              <i class="pi pi-link tw:text-neutral tw:text-sm"></i>
              <input
                pInputText
                class="tw:flex-1 tw:bg-transparent"
                style="
                  border: none;
                  border-bottom: 1px solid var(--color-neutral);
                  border-radius: 0;
                  box-shadow: none;
                  padding-left: 0;
                "
                placeholder="Optional link (URL)"
                [(ngModel)]="option.url"
                [name]="'option-url-' + $index"
                type="url"
              />
            </div>
          </div>
        </app-side-color-card>
      }
    </div>

    <!-- Add option button -->
    <app-add-card cto="Add option" [iconLeft]="true" (action)="addOption()" />
  </div>

  <!-- Bottom action bar -->
  <div
    class="tw:fixed tw:bottom-0 tw:left-0 tw:w-full tw:z-50 tw:bg-white/80 tw:backdrop-blur-md tw:p-4 tw:flex tw:justify-center p-fluid"
  >
    <p-button
      class="tw:w-full tw:max-w-md"
      label="Create poll"
      icon="pi pi-send"
      [disabled]="!isValid()"
      (click)="submit()"
    />
  </div>
</div>
