@let _poll = poll();

<p-card>
  <div class="tw:flex tw:items-start tw:justify-between tw:mb-4 tw:gap-3">
    <div>
      <app-option-type-icon [type]="_poll.optionType" />
    </div>
    <div class="tw:flex tw:flex-col tw:flex-1">
      <h3>{{ _poll.name }}</h3>
      @if (_poll.description) {
        <p class="label-sm tw:mt-1">{{ _poll.description }}</p>
      }
      <div class="tw:flex tw:items-center tw:gap-3 tw:mt-2">
        <span
          [pTooltip]="
            'project.detail.item.options'
              | translate: { count: _poll.optionCount }
          "
          tooltipPosition="top"
          class="tw:flex tw:items-center tw:gap-1 label-sm tw:cursor-default"
        >
          <i class="fa-solid fa-list"></i>
          <span>{{ _poll.optionCount }}</span>
        </span>
        <p-button
          [text]="true"
          size="small"
          icon="fa-regular fa-comments"
          [label]="_poll.commentCount.toString()"
          [pTooltip]="
            'project.detail.item.comments'
              | translate: { count: _poll.commentCount }
          "
          tooltipPosition="top"
          [routerLink]="[
            '/project/detail',
            _poll.projectId,
            _poll.nextOpenOptionId ? 'poll-overview' : 'results',
            _poll.pollId,
          ]"
          fragment="comments-section"
        />
      </div>
    </div>
    @if (showMenu()) {
      <div>
        <p-button
          icon="fa-solid fa-ellipsis-vertical"
          [text]="true"
          (click)="menu.toggle($event)"
          data-testid="poll-menu-btn"
        />
        <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />
      </div>
    }
  </div>

  <div class="tw:flex tw:flex-col tw:gap-1">
    @if (_poll.nextOpenOptionId) {
      <p-button
        fluid
        severity="primary"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'vote',
          _poll.pollId,
          _poll.nextOpenOptionId,
        ]"
        [label]="'project.common.vote' | translate"
      />
      <p-button
        fluid
        severity="secondary"
        size="small"
        [text]="true"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'poll-overview',
          _poll.pollId,
        ]"
        [label]="'project.detail.item.voteOverview' | translate"
      />
    } @else {
      <p-button
        fluid
        severity="primary"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'results',
          _poll.pollId,
        ]"
        [label]="'project.detail.item.pollOverview' | translate"
      />
      <p-button
        fluid
        severity="secondary"
        size="small"
        [text]="true"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'vote',
          _poll.pollId,
        ]"
        [queryParams]="{ revote: '1' }"
        [label]="'project.votesOverview.reVote' | translate"
      />
    }
  </div>
</p-card>
