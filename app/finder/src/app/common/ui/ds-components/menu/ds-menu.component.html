<div [hlmDropdownMenuTrigger]="menuPanel" class="inline-flex cursor-pointer">
    <ng-content />
</div>

<ng-template #menuPanel>
    <hlm-dropdown-menu data-testid="menu-panel">
        @for (item of items(); track item.label; let first = $first) {
            @if (item.separatorBefore && !first) {
                <div
                    class="mx-1.5 my-1 h-px bg-[var(--border-hairline)]"
                    role="separator"
                ></div>
            }
            <div class="m-1.5">
                <button
                    hlmDropdownMenuItem
                    data-testid="menu-item"
                    class="flex w-full cursor-pointer! items-center gap-2.5! rounded-[var(--radius-xs)]! px-2.5! py-[9px]! text-left [font-family:var(--font-body)] font-semibold text-[var(--fs-ui)]! transition-colors duration-[120ms] ease-[var(--ease-standard)] hover:bg-[var(--sand-100)]!"
                    [class]="
                        item.danger
                            ? 'text-[var(--negative)]!'
                            : 'text-[var(--ink-700)]!'
                    "
                    (click)="item.onClick()"
                >
                    <ds-icon [name]="item.icon" [size]="15" />
                    {{ item.label }}
                </button>
            </div>
        }
    </hlm-dropdown-menu>
</ng-template>
