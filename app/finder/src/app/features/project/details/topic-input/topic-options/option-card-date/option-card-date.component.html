<app-side-color-card [color]="'tertiary'">
  <div class="tw:flex tw:flex-col tw:gap-3">
    <div class="tw:flex tw:items-start tw:gap-2">
      <div class="tw:flex tw:flex-col tw:gap-2 tw:flex-1">
        <!-- Start date -->
        <div class="tw:flex tw:flex-col tw:gap-1">
          <label class="tw:text-xs tw:font-semibold tw:text-gray-600">
            {{ "project.pollInput.date.startDate" | translate }}
          </label>
          <p-datepicker
            [showTime]="true"
            hourFormat="24"
            [showIcon]="true"
            appendTo="body"
            styleClass="tw:w-full"
            [(ngModel)]="option().startDate"
            [name]="'start-date-' + index()"
          />
        </div>

        <!-- End date -->
        <div class="tw:flex tw:flex-col tw:gap-1">
          <label class="tw:text-xs tw:font-semibold tw:text-gray-600">
            {{ "project.pollInput.date.endDate" | translate }}
          </label>
          <p-datepicker
            [showTime]="true"
            hourFormat="24"
            [showIcon]="true"
            appendTo="body"
            styleClass="tw:w-full"
            [(ngModel)]="option().endDate"
            [name]="'end-date-' + index()"
          />
        </div>
      </div>

      @if (canRemove()) {
        <p-button
          type="button"
          icon="fa-solid fa-xmark"
          [text]="true"
          severity="secondary"
          (click)="remove.emit()"
        />
      }
    </div>
  </div>
</app-side-color-card>
