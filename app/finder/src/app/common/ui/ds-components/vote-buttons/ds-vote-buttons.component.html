<div class="flex w-full items-center justify-center gap-[14px]">
    <button
        type="button"
        class="flex h-[62px] w-[62px] shrink-0 cursor-pointer items-center justify-center rounded-full border-[1.5px] border-solid border-[#f0c3bd] bg-white transition-transform duration-[var(--duration-fast)] ease-[var(--ease-standard)] active:scale-[0.92]"
        (click)="no.emit()"
    >
        <ds-icon name="close" [size]="24" color="var(--negative)" />
    </button>
    @if (showMaybe()) {
        <button
            type="button"
            class="flex h-[54px] w-[54px] shrink-0 cursor-pointer items-center justify-center rounded-full border-[1.5px] border-solid border-[#e6cfa4] bg-white transition-transform duration-[var(--duration-fast)] ease-[var(--ease-standard)] active:scale-[0.92]"
            (click)="maybe.emit()"
        >
            <ds-icon name="info" [size]="21" color="var(--warning)" />
        </button>
    }
    @if (showSkip()) {
        <ds-button variant="neutral" size="sm" (click)="skip.emit()">
            {{ skipLabel() }}
        </ds-button>
    }
    <button
        type="button"
        class="flex h-[62px] w-[62px] shrink-0 cursor-pointer items-center justify-center rounded-full border-none bg-[var(--positive-strong)] shadow-[0_8px_20px_rgba(93,154,86,0.34)] transition-transform duration-[var(--duration-fast)] ease-[var(--ease-standard)] active:scale-[0.92]"
        (click)="yes.emit()"
    >
        <ds-icon name="check" [size]="25" color="#fff" />
    </button>
</div>
