<p-card>
  <div class="tw:flex tw:flex-col tw:gap-3">
    <div class="tw:flex tw:items-start tw:gap-2">
      <div class="tw:flex tw:flex-col tw:gap-2 tw:flex-1">
        <div class="tw:flex tw:gap-1">
          @for (day of weekdayButtons; track day.value) {
            <button
              type="button"
              class="tw:flex-1 tw:py-1.5 tw:rounded tw:text-xs tw:font-medium tw:transition-colors tw:border-0 tw:cursor-pointer"
              [class]="option().weekday === day.value
                ? 'tw:bg-primary tw:text-white'
                : 'tw:bg-gray-100 tw:text-gray-600 hover:tw:bg-gray-200'"
              (click)="selectWeekday(day.value)"
              [attr.aria-label]="day.ariaLabel"
              [attr.aria-pressed]="option().weekday === day.value"
            >
              {{ day.label }}
            </button>
          }
        </div>

        @if (showTime()) {
          <div class="tw:flex tw:flex-col tw:gap-1">
            <div class="tw:flex tw:items-center tw:justify-between">
              <label class="tw:text-xs tw:font-semibold tw:text-gray-600">
                {{ "project.pollInput.date.startTime" | translate }}
              </label>
              @if (canRemoveTime()) {
                <button
                  type="button"
                  class="tw:text-xs tw:text-gray-400 hover:tw:text-red-500 tw:transition-colors tw:bg-transparent tw:border-0 tw:cursor-pointer tw:p-0"
                  (click)="removeTime()"
                >
                  <i class="fa-solid fa-xmark"></i>
                </button>
              }
            </div>
            <p-datepicker
              [timeOnly]="true"
              hourFormat="24"
              [showIcon]="true"
              [stepMinute]="15"
              appendTo="body"
              styleClass="tw:w-full"
              [(ngModel)]="option().startTime"
              [name]="'weekday-time-' + index()"
            />
          </div>
        } @else {
          <button
            type="button"
            class="tw:flex tw:items-center tw:gap-1 tw:text-sm tw:text-gray-400 tw:cursor-pointer hover:tw:text-primary tw:transition-colors tw:bg-transparent tw:border-0 tw:p-0 tw:self-start"
            (click)="addTime()"
          >
            <i class="fa-solid fa-plus" style="font-size: 11px"></i>
            {{ "project.pollInput.date.addTime" | translate }}
          </button>
        }
      </div>

      @if (canRemove()) {
        <p-button
          type="button"
          icon="fa-solid fa-xmark"
          [text]="true"
          severity="secondary"
          (click)="remove.emit()"
        />
      }
    </div>
  </div>
</p-card>
