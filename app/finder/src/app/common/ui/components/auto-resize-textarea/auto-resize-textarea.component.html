<textarea
  #textarea
  hlmTextarea
  rows="1"
  style="min-height: 0"
  class="w-full resize-none overflow-y-auto [field-sizing:fixed]"
  [placeholder]="placeholder()"
  [attr.maxlength]="maxlength() ?? null"
  [attr.id]="inputId() ?? null"
  [style.max-height]="maxHeight()"
  [value]="textValue()"
  [disabled]="isDisabled()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>
