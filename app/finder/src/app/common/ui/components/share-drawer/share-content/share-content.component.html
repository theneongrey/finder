<hlm-tabs [tab]="activeTab()" (tabActivated)="setActiveTab($event)">
  <hlm-tabs-list variant="line" class="mb-0">
    <button hlmTabsTrigger="invite">{{ 'project.share.invite' | translate }}</button>
    <button hlmTabsTrigger="members">
      {{ 'project.share.tabAccess' | translate }}
      @if (memberCount() > 0) {
        <span class="ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold leading-none bg-[var(--accent-tint)] text-[var(--accent)]">{{ memberCount() }}</span>
      }
    </button>
  </hlm-tabs-list>

  <div hlmTabsContent="invite" class="mt-5">
    <app-share-access-form
      [visibilityOptions]="visibilityOptions()"
      [selectedVisibility]="selectedVisibility()"
      [isPublic]="isPublic()"
      [shareLink]="shareLink()"
      (visibilityChange)="onVisibilityChange($event)"
    />
    <app-share-invite-form
      class="block mt-5"
      [projectId]="projectId()"
      [contacts]="sharingContacts()"
      [sharingInProgress]="sharingInProgress()"
    />
  </div>

  <div hlmTabsContent="members" class="mt-5">
    <app-share-members-list
      [projectId]="projectId()"
      [members]="sharedWith()"
      [isPublic]="isPublic()"
      (goInvite)="goToInviteTab()"
    />
  </div>
</hlm-tabs>
