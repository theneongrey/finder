<!-- @dsCard group="Colors" viewport="700x190" subtitle="Warm cream backgrounds + ink text neutrals" name="Neutrals" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;}
.row{display:flex;gap:8px;margin-bottom:8px;}
.sw{flex:1;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;font-family:monospace;border:1px solid rgba(0,0,0,.06);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--cream-50);">50</div>
  <div class="sw" style="background:var(--cream-100);">100</div>
  <div class="sw" style="background:var(--cream-200);">200 app-bg</div>
  <div class="sw" style="background:var(--cream-300);">300</div>
  <div class="sw" style="background:var(--cream-400);">400</div>
  <div class="sw" style="background:var(--sand-100);">sand-100</div>
  <div class="sw" style="background:var(--sand-300);">sand-300</div>
  <div class="sw" style="background:var(--sand-500);">sand-500</div>
</div>
<div class="row">
  <div class="sw" style="background:var(--ink-900);color:#fff;">ink-900</div>
  <div class="sw" style="background:var(--ink-600);color:#fff;">ink-600</div>
  <div class="sw" style="background:var(--ink-400);color:#fff;">ink-400</div>
  <div class="sw" style="background:var(--ink-300);color:#fff;">ink-300</div>
  <div class="sw" style="background:var(--ink-250);color:#fff;">ink-250</div>
  <div class="sw" style="background:var(--ink-200);color:#fff;">ink-200</div>
</div>
</body></html>
