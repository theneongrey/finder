<!-- @dsCard group="Iconography" viewport="700x220" subtitle="Custom thin-line icon set, 2-2.6px stroke, round caps" name="Icon set" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--accent);}
label{font-size:9.5px;font-family:monospace;color:var(--text-muted);}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const icons = {
  'logo': 'M4.5 12.5l4.5 4.5L20 5',
  'chevron-left': 'M15 5l-7 7 7 7',
  'comment': 'M20 4H4a1.5 1.5 0 0 0-1.5 1.5V15A1.5 1.5 0 0 0 4 16.5h3V20l4-3.5h9A1.5 1.5 0 0 0 21.5 15V5.5A1.5 1.5 0 0 0 20 4z',
  'edit': 'M4 20h4L20 8l-4-4L4 16z',
  'trash': 'M4 7h16',
  'lock': 'M8 10V7a4 4 0 0 1 8 0v3',
  'calendar': 'M3.5 9.5h17',
  'clock': 'M12 7.5V12l3 2',
  'refresh': 'M17 2.5l4 4-4 4',
  'trophy': 'M8 4h8v4a4 4 0 0 1-8 0V4z',
  'heart': 'M12 20.3s-7.5-4.6-9.7-9C.8 8 2 4.7 5 3.7c2.2-.7 4.3.2 5.6 2 .4.5 1 1.4 1.4 1.4s1-.9 1.4-1.4c1.3-1.8 3.4-2.7 5.6-2 3 1 4.2 4.3 2.7 7.6-2.2 4.4-9.7 9-9.7 9z',
  'send': 'M2.5 12L21 3l-6 18-4.5-7.5L2.5 12z',
  'close': 'M5 5l14 14M19 5L5 19',
  'folder': 'M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  'checklist': 'M8 12.3l2.7 2.7L16.4 9',
  'users': 'M17 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 5 18.5V20',
  'plus': 'M12 5v14M5 12h14',
  'play': 'M6 4l14 8-14 8V4z',
};
const g = document.getElementById('g');
Object.entries(icons).forEach(([name, d]) => {
  const fill = ['logo'].includes(name) ? false : ['play','send'].includes(name);
  g.innerHTML += '<div class="cell"><svg width="22" height="22" viewBox="0 0 24 24" fill="' + (fill?'currentColor':'none') + '" stroke="' + (fill?'none':'currentColor') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"></path></svg><label>' + name + '</label></div>';
});
</script>
</body></html>
