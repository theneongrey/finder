@if (poll(); as poll) {
    <div class="lg:flex">
        <!-- Main column -->
        <div class="min-w-0 lg:flex-1">
            <app-results-toolbar
                [canManage]="canManagePoll()"
                [isClosed]="poll.isClosed"
                [commentsHidden]="!showComments()"
                (startVote)="startVote()"
                (addOption)="showAddOption.set(true)"
                (closePoll)="closePoll()"
                (reopenPoll)="reopenPoll()"
                (showComments)="showComments.set(true)"
                (refresh)="refresh()"
            />

            <div class="flex flex-col gap-4 p-4 pb-8 lg:gap-5 lg:p-6">
                <app-poll-header
                    [name]="poll.name"
                    [description]="poll.description"
                    [isClosed]="poll.isClosed"
                    [canManage]="canManagePoll()"
                    [typeLabel]="typeLabel()"
                    [statusLabel]="statusLabel()"
                    [closeDateText]="closeDateText()"
                    [commentCount]="poll.comments.length"
                    [sortLabel]="sortLabel()"
                    (toggleSort)="toggleSort()"
                    (save)="savePollDetails($event)"
                    (delete)="deletePoll()"
                    (openComments)="showMobileComments.set(true)"
                />

                <!-- Separator between header and cards -->
                <hr
                    class="h-px border-0"
                    style="background: var(--border-hairline)"
                />

                @if (canManagePoll() && !poll.isClosed && showAddOption()) {
                    <app-add-option-panel
                        class="add-option-animate block"
                        animate.enter="add-option-enter"
                        animate.leave="add-option-leave"
                        [optionType]="poll.optionType"
                        [dateType]="addPanelDateType()"
                        [showTime]="addPanelShowTime()"
                        (add)="onAddOption($event)"
                        (cancelled)="showAddOption.set(false)"
                    />
                }

                <app-option-list
                    [options]="poll.options"
                    [optionType]="poll.optionType"
                    [members]="project()?.sharedWith ?? []"
                    [comments]="poll.comments"
                    [projectId]="project()?.id ?? ''"
                    [pollId]="pollId()"
                    [isClosed]="poll.isClosed"
                    [showSortButton]="false"
                    [(sort)]="sortMode"
                    (openComments)="openOptionComments($event)"
                />
            </div>
        </div>

        <!-- Comments sidebar (desktop only) — width animates open/close -->
        <aside
            class="hidden min-w-0 flex-none self-start overflow-hidden transition-[width] duration-300 ease-out motion-reduce:transition-none lg:sticky lg:top-[60px] lg:block lg:h-[calc(100dvh-60px)]"
            [style.width.px]="showComments() ? 380 : 0"
        >
            <div class="h-full w-[380px]">
                <app-comments-section
                    [comments]="poll.comments"
                    (addComment)="addComment($event)"
                    (dismiss)="showComments.set(false)"
                />
            </div>
        </aside>
    </div>
} @else {
    <app-results-skeleton />
}

<!-- Poll-level comments drawer (mobile only) -->
<ds-side-drawer
    [open]="showMobileComments()"
    (dismissed)="showMobileComments.set(false)"
>
    @if (showMobileComments() && poll(); as poll) {
        <app-comments-section
            [comments]="poll.comments"
            (addComment)="addComment($event)"
            (dismiss)="showMobileComments.set(false)"
        />
    }
</ds-side-drawer>

<!-- Per-option comments drawer (opens from the right) -->
<ds-side-drawer
    [open]="commentsOption() !== undefined"
    (dismissed)="commentsOption.set(undefined)"
>
    @if (commentsOption(); as option) {
        <app-comments-section
            [comments]="optionComments()"
            [optionTitle]="commentsOptionTitle()"
            (addComment)="addOptionComment($event)"
            (dismiss)="commentsOption.set(undefined)"
        />
    }
</ds-side-drawer>

@if (project(); as project) {
    <app-share-drawer
        [title]="shareDrawerTitle()"
        [subtitle]="shareDrawerSubtitle()"
        [visible]="showShareDrawer()"
        (visibleChange)="showShareDrawer.set($event)"
    >
        <app-share-content
            [projectId]="project.id"
            [sharedWith]="project.sharedWith"
            [visibilityType]="project.visibilityType"
            [inCard]="false"
        />
    </app-share-drawer>
}
