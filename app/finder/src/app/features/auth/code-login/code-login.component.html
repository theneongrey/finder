<!-- Progress dots: steps 1 + 2 active -->
<div class="flex" style="gap: 7px; margin-bottom: 16px">
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--accent)"
  ></span>
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--accent)"
  ></span>
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--sand-200)"
  ></span>
</div>

<form
  [formGroup]="form"
  (ngSubmit)="verifyCode()"
  class="flex flex-col"
  style="gap: 0"
>
  <div
    style="
      font-family: var(--font-display);
      font-size: var(--fs-display-md);
      font-weight: var(--weight-bold);
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: var(--text-primary);
    "
  >
    Code eingeben
  </div>
  <p
    style="
      margin: 8px 0 0;
      font-size: var(--fs-body-sm);
      line-height: 1.45;
      color: var(--text-secondary);
      text-wrap: pretty;
    "
  >
    Wir haben einen 6-stelligen Code an
    <strong style="color: var(--text-body); font-weight: var(--weight-bold)">{{
      email()
    }}</strong>
    geschickt.
  </p>

  <div class="flex justify-center" style="margin-top: 22px">
    <ds-input-otp formControlName="code" [length]="6" [groupSize]="3" />
  </div>

  @if (hasError()) {
    <div
      class="flex items-center"
      style="
        gap: 6px;
        padding-top: 10px;
        font-size: var(--fs-ui-sm);
        font-weight: var(--weight-semibold);
        color: var(--negative);
      "
    >
      <ds-icon name="warning" [size]="14" color="var(--negative)" />
      <span>Code ungültig – bitte erneut versuchen.</span>
    </div>
  }

  <div style="margin-top: 16px">
    <ds-button
      variant="primary"
      [fullWidth]="true"
      [disabled]="form.invalid"
    >
      Bestätigen
    </ds-button>
  </div>
</form>

<div style="margin-top: 14px">
  <ds-button variant="ghost" size="sm" (click)="editEmail()">
    E-Mail ändern
  </ds-button>
</div>
