<div class="flex-1 flex items-center justify-center overflow-hidden" style="background: var(--bg-panel); border-bottom: 1px solid var(--border-hairline-soft);">
  <img [src]="imageUrl()" alt="preview-image" class="w-full h-full object-cover" />
</div>

<div class="flex flex-col gap-2 p-5">
  <p
    class="leading-snug"
    style="font-size: var(--fs-body-sm); font-weight: var(--weight-semibold); color: var(--text-primary);"
  >
    {{ text() }}
  </p>
  @if (description()) {
    <p style="font-size: var(--fs-body-xs); color: var(--text-secondary);">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <button
      class="inline-flex items-center gap-2 self-start mt-1"
      style="height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-hairline); background: #fff; font-size: var(--fs-ui-sm); font-weight: var(--weight-bold); color: var(--accent); cursor: pointer;"
      (click)="openLink(link())"
    >
      <ds-icon name="link" [size]="14" color="var(--accent)" />
      {{ 'project.vote.openLink' | translate }}
    </button>
  }
</div>
