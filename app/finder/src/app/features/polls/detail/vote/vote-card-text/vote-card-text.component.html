<div
  class="flex flex-col items-center justify-center gap-4 flex-1 p-6"
>
  <i class="fa-regular fa-thumbs-up text-3xl text-primary"></i>
  <p class="text-2xl font-semibold text-surface-900 text-center leading-snug">
    {{ text() }}
  </p>
  @if (description()) {
    <p class="text-sm text-surface-500 text-center">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <a hlmBtn variant="outline" size="sm" [href]="link()" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>Link öffnen
    </a>
  }
</div>
