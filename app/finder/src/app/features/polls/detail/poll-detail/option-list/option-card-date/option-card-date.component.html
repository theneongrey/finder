<app-swipe-vote-card
    [enabled]="!isClosed()"
    mode="date"
    (swiped)="onSwiped($event)"
>
    <div class="group h-full">
        <ds-card [fill]="true" [padding]="0">
            <!-- Body -->
            <div class="flex flex-1 flex-col p-4">
                <!-- Title + menu -->
                <div class="flex items-start gap-2">
                    <div class="min-w-0 flex-1 pt-1">
                        <span
                            class="font-display block text-[19px] leading-[1.2] font-bold tracking-[-0.3px] text-pretty text-[color:var(--text-primary)]"
                            >{{ label() }}</span
                        >
                        @if (subLabel(); as sub) {
                            <span
                                class="mt-0.5 block text-[13px] text-[color:var(--text-secondary)]"
                                >{{ sub }}</span
                            >
                        }
                    </div>
                    @if (menuItems().length) {
                        <span class="-mr-1.5 shrink-0">
                            <ds-menu [items]="menuItems()">
                                <ds-button
                                    variant="ghost"
                                    [size]="32"
                                    icon="kebab"
                                    [label]="
                                        'project.results.moreActions'
                                            | translate
                                    "
                                    data-testid="option-menu"
                                />
                            </ds-menu>
                        </span>
                    }
                </div>

                @if (deleteConfirm()) {
                    <div class="mt-3 flex items-center gap-2">
                        <span
                            class="min-w-0 flex-1 text-[13px] text-[color:var(--text-secondary)]"
                        >
                            {{
                                'project.results.deleteOptionPrompt' | translate
                            }}
                        </span>
                        <ds-button
                            variant="ghost"
                            size="sm"
                            (click)="deleteConfirm.set(false)"
                        >
                            {{ 'project.results.cancel' | translate }}
                        </ds-button>
                        <ds-button
                            variant="danger"
                            size="sm"
                            data-testid="option-delete-confirm"
                            (click)="confirmDelete()"
                        >
                            {{ 'project.results.delete' | translate }}
                        </ds-button>
                    </div>
                }

                <div class="mt-auto">
                    @if (!hideResults()) {
                        <!-- Voters + summary -->
                        <div class="mt-4">
                            <app-option-voters
                                [creator]="option().creator"
                                [creatorVoted]="creatorVoted()"
                                [users]="avatarUsers()"
                            >
                                <span
                                    class="block truncate text-[12.5px] font-semibold text-[color:var(--text-secondary)]"
                                >
                                    {{ voteLine() }}
                                </span>
                            </app-option-voters>
                        </div>
                    }

                    <hr
                        class="mt-4 border-t border-[color:var(--border-hairline)]"
                    />

                    <!-- Actions -->
                    <div class="pt-4">
                        <app-option-card-actions
                            mode="yesno"
                            [choice]="option().choice"
                            [commentCount]="commentCount()"
                            [disabled]="isClosed()"
                            (vote)="castVote($event)"
                            (commentsClick)="commentsClick.emit()"
                        />
                    </div>
                </div>
            </div>
        </ds-card>
    </div>
</app-swipe-vote-card>
