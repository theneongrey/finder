<!-- Progress dots: step 1 active -->
<div class="flex gap-[7px] mb-[16px]">
  <span class="h-[4px] flex-1 rounded-full bg-[var(--accent)]"></span>
  <span class="h-[4px] flex-1 rounded-full bg-[var(--sand-200)]"></span>
  <span class="h-[4px] flex-1 rounded-full bg-[var(--sand-200)]"></span>
</div>

<form
  [formGroup]="form"
  (ngSubmit)="sendLoginMail()"
  class="flex flex-col gap-0"
>
  <div class="[font-family:var(--font-display)] text-[var(--fs-display-md)] font-bold tracking-[-0.6px] leading-[1.1] text-[var(--text-primary)]">
    {{ 'auth.requestEmail.heading' | translate }}
  </div>
  <p class="mt-[8px] text-[var(--fs-body-sm)] leading-[1.45] text-[var(--text-secondary)] text-pretty">
    {{ 'auth.requestEmail.subtitle' | translate }}
  </p>

  <div class="mt-[20px]">
    <ds-input
      formControlName="email"
      [label]="'auth.requestEmail.email' | translate"
      [placeholder]="'auth.requestEmail.emailPlaceholder' | translate"
      [error]="errorMessage()"
    />
  </div>

  <div class="mt-[18px]">
    <ds-button
      variant="primary"
      [fullWidth]="true"
      trailingIcon="arrow-right"
      [disabled]="form.invalid"
      [loading]="isLoading()"
    >
      {{ 'auth.requestEmail.sendCode' | translate }}
    </ds-button>
  </div>

  <p class="mt-[14px] text-[var(--fs-caption)] leading-[1.5] text-[var(--text-muted)] text-center text-pretty">
    {{ 'auth.requestEmail.newUserHint' | translate }}
  </p>
</form>
