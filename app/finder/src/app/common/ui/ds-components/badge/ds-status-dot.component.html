<span
    class="inline-flex h-[23px] items-center justify-start gap-1.5 rounded-[var(--radius-xs)] pr-2.5 pl-2 text-left font-bold text-[var(--fs-caption)]"
    [class]="wrapClass()"
>
    <span
        class="h-1.5 w-1.5 shrink-0 rounded-full"
        [class]="dotClass()"
        [class.ds-status-dot--pulse]="tone() === 'positive'"
    >
    </span>
    <ng-content />
</span>
