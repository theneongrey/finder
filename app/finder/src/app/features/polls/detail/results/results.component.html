@let _projectId = projectId();
@if (_projectId) {
  <div class="flex flex-col gap-6 p-4 pb-8">
    @if (poll(); as poll) {
      <app-vote-overview-summary
        [poll]="poll"
        [commentsCount]="poll.comments.length"
        [projectId]="_projectId"
        [pollId]="pollId()"
      />

      <app-option-list
        [options]="poll.options"
        [projectId]="_projectId"
        [pollId]="pollId()"
        [optionType]="poll.optionType"
      />

      <app-comments-section
        [comments]="poll.comments"
        (addComment)="addComment($event)"
      />

      @if (canClosePoll()) {
        <button
          hlmBtn
          variant="destructive"
          class="w-full"
          data-testid="close-poll-btn"
          (click)="closePoll()"
        >
          <i class="fa-solid fa-lock mr-2"></i>
          Umfrage jetzt schließen
        </button>
      }
    } @else {
      <div class="flex justify-center items-center h-32">
        <p class="text-gray-500">
          {{ "project.votesOverview.loading" | translate }}
        </p>
      </div>
    }
  </div>
}
