<app-auth-step-indicator [step]="3" />

<div class="text-center pt-[6px] pb-[4px]">
  <div class="auth-success-circle">
    <ds-icon name="check" [size]="30" color="#5d9a56" />
  </div>

  <div class="[font-family:var(--font-display)] text-[var(--fs-display-md)] lg:text-[28px] font-bold tracking-[-0.6px] leading-[1.1] text-[var(--text-primary)] mt-[18px]">
    {{ 'auth.loginSuccess.heading' | translate }}
  </div>
  <p class="mt-[8px] text-[var(--fs-body-sm)] lg:text-[var(--fs-body)] text-[var(--text-secondary)]">
    {{ 'auth.loginSuccess.redirect' | translate }}
  </p>

  <div class="h-[4px] rounded-full bg-[var(--sand-200)] overflow-hidden mt-[22px]">
    <div
      [style.width]="barWidth()"
      class="h-full rounded-full bg-[var(--accent)] [transition:width_1.4s_cubic-bezier(0.3,0.7,0.3,1)]"
    ></div>
  </div>
</div>
