<hlm-sheet
  [state]="open() ? 'open' : 'closed'"
  side="bottom"
  (stateChanged)="onStateChanged($event)"
>
  <hlm-sheet-content
    *hlmSheetPortal
    class="ds-sheet-panel"
    [showCloseButton]="false"
  >
    <div
      class="ds-sheet-handle"
      style="cursor: grab; touch-action: none"
      (pointerdown)="onHandlePointerDown($event)"
      (pointermove)="onHandlePointerMove($event)"
      (pointerup)="onHandlePointerUp()"
      (pointercancel)="onHandlePointerUp()"
    ></div>
    <div class="ds-sheet-header pb-3 lg:pt-3">
      <div class="ds-sheet-titles">
        <div class="ds-sheet-title">{{ title() }}</div>
        @if (subtitle()) {
          <div class="ds-sheet-subtitle">{{ subtitle() }}</div>
        }
      </div>
      <ds-button
        icon="close"
        variant="dark"
        [size]="32"
        data-testid="bottom-sheet-close-btn"
        (click)="dismissed.emit()"
      />
    </div>
    <ng-content />
  </hlm-sheet-content>
</hlm-sheet>
