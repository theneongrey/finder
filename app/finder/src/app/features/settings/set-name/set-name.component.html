<form class="tw-flex tw-w-full tw-h-full tw-bg-red-50" [formGroup]="form">
  <div class="tw-m-auto tw-flex tw-flex-col">
    <h3 class="tw-mx-auto tw-mb-3">Login</h3>
    <label class="tw-block tw-mx-auto" for="name">Please enter your name</label>
    <input id="name" class="tw-border-black tw-border"
           [class.invalid]="form.get('name')!.invalid && form.get('name')!.dirty"
           type="text" formControlName="email" autofocus />
    <button (click)="(updateName())" [disabled]="form.invalid">Send Mail</button>
  </div>
</form>
