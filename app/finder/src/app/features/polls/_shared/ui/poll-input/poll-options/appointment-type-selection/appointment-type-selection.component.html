<div style="display:flex;gap:7px;overflow-x:auto;padding:1px 2px 3px">
  @for (t of types; track t.type) {
    <button
      type="button"
      class="flex items-center gap-[6px] cursor-pointer"
      style="flex-shrink:0;height:38px;padding:0 13px;border-radius:12px;border-width:1.5px;border-style:solid;font-size:var(--fs-ui);font-weight:var(--weight-bold);white-space:nowrap;transition:border-color var(--duration-standard) ease,background var(--duration-standard) ease,color var(--duration-standard) ease"
      [style.border-color]="t.type === selectedType() ? 'var(--accent-border)' : 'var(--border-hairline-strong)'"
      [style.background]="t.type === selectedType() ? 'var(--accent-tint)' : 'var(--bg-sheet)'"
      [style.color]="t.type === selectedType() ? 'var(--accent)' : 'var(--text-secondary)'"
      [attr.data-testid]="'appt-type-' + t.type"
      (click)="typeSelected.emit(t.type)"
    >
      @if (t.type === selectedType()) {
        <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none"></span>
      }
      {{ t.labelKey | translate }}
    </button>
  }
</div>
