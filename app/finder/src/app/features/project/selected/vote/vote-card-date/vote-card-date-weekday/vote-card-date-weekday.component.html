<div class="tw:flex tw:gap-2">
  @for (day of weekdays; track day) {
    <div
      class="tw:flex tw:flex-col tw:w-9 tw:h-16 tw:rounded-xl tw:overflow-hidden tw:border-2 tw:border-primary/50"
    >
      <div class="tw:h-6 tw:flex tw:items-center tw:justify-center tw:bg-white">
        <span class="tw:text-[12px] tw:font-bold tw:text-primary tw:leading-none">{{
          weekdayShortName(day)
        }}</span>
      </div>
      @if (day === entry().weekday) {
        <div class="tw:h-px tw:bg-primary"></div>
        <div class="tw:flex-1 tw:flex tw:items-center tw:justify-center tw:bg-primary">
          <i class="fa-solid fa-check tw:text-white tw:text-xs"></i>
        </div>
      } @else if (otherWeekdays().has(day)) {
        <div class="tw:h-px tw:bg-primary/30"></div>
        <div class="tw:flex-1 tw:bg-primary/20"></div>
      } @else {
        <div class="tw:h-px tw:bg-surface-200"></div>
        <div class="tw:flex-1 tw:bg-surface-100"></div>
      }
    </div>
  }
</div>
<div class="tw:flex tw:items-baseline tw:gap-2">
  <p class="tw:text-[26px] tw:font-semibold tw:text-surface-900">
    {{ weekdayName(entry().weekday!) }}
  </p>
  @if (entry().startTime; as t) {
    <span class="tw:text-surface-300">·</span>
    <p class="tw:text-[26px] tw:font-medium tw:text-surface-500">{{ formatTimeOnly(t) }}</p>
  }
</div>
