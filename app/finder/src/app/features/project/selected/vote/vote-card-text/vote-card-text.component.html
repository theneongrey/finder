<div
  class="tw:flex tw:flex-col tw:items-center tw:justify-center tw:gap-4 tw:flex-1 tw:p-6"
>
  <i class="fa-regular fa-thumbs-up tw:text-3xl tw:text-primary"></i>
  <p class="tw:text-2xl tw:font-semibold tw:text-surface-900 tw:text-center tw:leading-snug">
    {{ text() }}
  </p>
  @if (description()) {
    <p class="tw:text-sm tw:text-surface-500 tw:text-center">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <a [href]="link()" target="_blank" rel="noopener noreferrer">
      <p-button label="Link öffnen" icon="fa-solid fa-arrow-up-right-from-square" size="small" variant="outlined" />
    </a>
  }
</div>
