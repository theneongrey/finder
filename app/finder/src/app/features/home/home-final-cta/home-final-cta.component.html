<div class="final-cta-card">
  <div class="final-glow"></div>
  <div class="final-cta-inner">
    <div class="final-cta-text">
      <h2 class="final-h2">{{ "home.finalCta.heading" | translate }}</h2>
      <p class="final-sub">{{ "home.finalCta.sub" | translate }}</p>
    </div>
    <div class="final-cta-action">
      <a routerLink="/auth/request-email" class="final-btn">
        <span>{{ "home.finalCta.btn" | translate }}</span>
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h13" />
          <path d="M12.5 6l6 6-6 6" />
        </svg>
      </a>
      <span class="final-note">{{ "home.finalCta.note" | translate }}</span>
    </div>
  </div>
</div>
