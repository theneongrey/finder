<div class="tw:flex tw:flex-col tw:gap-3 tw:mx-4 tw:pb-28">
  <!-- Your question -->
  <div class="tw:flex tw:flex-col tw:gap-1">
    <label class="tw:text-sm tw:font-semibold tw:px-1" for="question">
      {{ "project.topicInput.yesNo.question" | translate }}
    </label>
    <div
      class="tw:bg-gray-50 tw:rounded-xl tw:border tw:border-transparent tw:transition-all tw:duration-300"
    >
      <input
        pInputText
        id="question"
        name="question"
        class="tw:w-full tw:bg-transparent"
        autocomplete="off"
        [placeholder]="
          'project.topicInput.yesNo.questionPlaceholder' | translate
        "
        [ngModel]="question()"
        (ngModelChange)="question.set($event)"
      />
    </div>
  </div>

  <!-- Description -->
  <div class="tw:flex tw:flex-col tw:gap-1">
    <label class="tw:text-sm tw:font-semibold tw:px-1" for="description">
      {{ "project.topicInput.yesNo.description" | translate }}
    </label>
    <textarea
      pTextarea
      id="description"
      name="description"
      class="tw:w-full tw:h-24"
      autocomplete="off"
      maxlength="200"
      [placeholder]="
        'project.topicInput.yesNo.descriptionPlaceholder' | translate
      "
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
    ></textarea>
  </div>

  <!-- Answer options -->
  <div class="tw:flex tw:flex-col tw:gap-2 tw:mt-4">
    <div class="tw:flex tw:justify-between tw:items-center tw:px-1">
      <span class="tw:text-sm tw:font-semibold">
        {{ "project.topicInput.yesNo.answerOptions" | translate }}
      </span>
      <span class="tw:text-xs tw:text-neutral">{{
        "project.topicInput.yesNo.minOptions" | translate
      }}</span>
    </div>

    <div class="tw:flex tw:flex-col tw:gap-3">
      @for (option of options(); track $index) {
        <app-side-color-card [color]="'primary'">
          <div class="tw:flex tw:flex-col tw:gap-3">
            <div class="tw:flex tw:items-center tw:gap-2">
              <input
                pInputText
                class="tw:flex-1 tw:bg-gray-50 tw:rounded-lg"
                maxlength="100"
                [placeholder]="
                  'project.topicInput.yesNo.optionPlaceholder'
                    | translate: { number: $index + 1 }
                "
                [(ngModel)]="option.text"
                [name]="'option-text-' + $index"
              />
              @if (options().length > 1) {
                <p-button
                  type="button"
                  icon="pi pi-times"
                  [text]="true"
                  severity="secondary"
                  (click)="removeOption($index)"
                />
              }
            </div>
            <div class="tw:flex tw:items-center tw:gap-2">
              <i class="pi pi-align-left tw:text-neutral tw:text-sm"></i>
              <input
                pInputText
                class="tw:flex-1 tw:bg-transparent"
                style="
                  border: none;
                  border-bottom: 1px solid var(--color-neutral);
                  border-radius: 0;
                  box-shadow: none;
                  padding-left: 0;
                "
                maxlength="100"
                [placeholder]="
                  'project.topicInput.yesNo.optionDescriptionPlaceholder'
                    | translate
                "
                [(ngModel)]="option.description"
                [name]="'option-description-' + $index"
              />
            </div>
            <div class="tw:flex tw:items-center tw:gap-2">
              <i class="pi pi-link tw:text-neutral tw:text-sm"></i>
              <input
                pInputText
                class="tw:flex-1 tw:bg-transparent"
                style="
                  border: none;
                  border-bottom: 1px solid var(--color-neutral);
                  border-radius: 0;
                  box-shadow: none;
                  padding-left: 0;
                "
                maxlength="2048"
                [placeholder]="
                  'project.topicInput.yesNo.urlPlaceholder' | translate
                "
                [(ngModel)]="option.url"
                [name]="'option-url-' + $index"
                type="url"
              />
            </div>
          </div>
        </app-side-color-card>
      }
    </div>

    <!-- Add option button -->
    <app-add-card
      [cto]="'project.topicInput.yesNo.addOption' | translate"
      [iconLeft]="true"
      (action)="addOption()"
    />
  </div>

  <!-- Bottom action bar -->
  <div
    class="tw:fixed tw:bottom-0 tw:left-0 tw:w-full tw:z-50 tw:bg-white/80 tw:backdrop-blur-md tw:p-4 tw:flex tw:justify-center p-fluid"
  >
    <p-button
      class="tw:w-full tw:max-w-md"
      [label]="
        mode() === 'add'
          ? ('project.topicInput.yesNo.createPoll' | translate)
          : ('project.topicInput.yesNo.updatePoll' | translate)
      "
      [icon]="mode() === 'add' ? 'pi pi-send' : 'pi pi-save'"
      [disabled]="!isValid()"
      (click)="submit()"
    />
  </div>
</div>
