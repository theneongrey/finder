<div class="flex flex-col h-full w-full">
  <app-title-bar class="sticky top-0 z-10" />

  <main
    class="flex-grow w-full max-w-md mx-auto px-4 py-6 flex flex-col gap-8"
  >
    <div class="flex flex-col items-center gap-2">
      @if (user(); as currentUser) {
        <div class="rounded-full border-4 border-white ds-shadow-raised">
          <app-user-avatar [user]="currentUser" size="xlarge" />
        </div>
      }
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="flex flex-col gap-6"
    >
      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="name"
        >
          {{ "settings.name" | translate }}
        </label>
        <input
          hlmInput
          id="name"
          type="text"
          formControlName="name"
          [placeholder]="'settings.namePlaceholder' | translate"
          autocomplete="name"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="email"
        >
          {{ "settings.email" | translate }}
        </label>
        <input
          hlmInput
          id="email"
          type="email"
          formControlName="email"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="language"
        >
          {{ "settings.language" | translate }}
        </label>
        <hlm-select formControlName="language" class="w-full">
          <hlm-select-trigger class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-item value="en">English</hlm-select-item>
            <hlm-select-item value="de">Deutsch</hlm-select-item>
            <hlm-select-item value="es">Español</hlm-select-item>
          </hlm-select-content>
        </hlm-select>
      </div>

      <button hlmBtn class="mt-2 w-full" type="submit" [disabled]="form.invalid" icon="fa-solid fa-check" [loading]="isSaving()">
        {{ 'settings.save' | translate }}
      </button>
    </form>
  </main>
</div>
