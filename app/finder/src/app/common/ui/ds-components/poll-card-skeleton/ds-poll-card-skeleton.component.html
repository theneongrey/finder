@for (item of items(); track $index) {
  <div class="card">
    <div class="row">
      <div class="bar" style="width: 104px; height: 20px"></div>
      <div class="bar" style="width: 56px; height: 16px"></div>
    </div>
    <div
      class="bar"
      [style.width]="item.w1"
      style="height: 22px; margin-top: 14px"
    ></div>
    <div
      class="bar bar--light"
      [style.width]="item.w2"
      style="height: 13px; margin-top: 9px"
    ></div>
    <div class="track" style="margin-top: 18px"></div>
    <div class="avatars">
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
    </div>
    <div class="cta"></div>
  </div>
}
