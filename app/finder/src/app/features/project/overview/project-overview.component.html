<div class="tw:flex tw:flex-col tw:h-full tw:w-full">
  <app-title-bar class="tw:sticky tw:top-0 tw:z-10" />
  <main
    fMaxHeightMinusHeader
    class="tw:flex-grow tw:max-w-5xl tw:mx-auto tw:w-full tw:h-full tw:rounded-t-2xl"
  >
    <div class="tw:flex tw:h-full tw:max-h-full tw:flex-col tw:mx-4">
      <section class="tw:mb-5">
        <h2>{{ "project.overview.title" | translate }}</h2>
        <p>{{ "project.overview.subtitle" | translate }}</p>
      </section>
      <div class="tw:grid tw:gap-4 tw:grid-cols-auto-fit tw:pb-8">
        @for (project of projects(); track project.id) {
          <app-project-item
            [project]="project"
            (deletionRequested)="deletionRequested(project)"
          />
        }
        <app-add-card
          [cto]="'project.overview.addNew.cto' | translate"
          [description]="'project.overview.addNew.description' | translate"
          (action)="navigateToAdd()"
        />
      </div>
    </div>
  </main>
</div>
<p-confirmdialog />
