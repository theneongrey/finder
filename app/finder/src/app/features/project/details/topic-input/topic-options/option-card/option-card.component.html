<app-side-color-card [color]="'primary'">
  <div class="tw:flex tw:flex-col tw:gap-2">
    <div class="tw:flex tw:items-center tw:gap-2">
      <input
        pInputText
        class="tw:flex-1 tw:bg-gray-50 tw:rounded-lg"
        maxlength="100"
        [placeholder]="
          'project.topicInput.yesNo.optionPlaceholder'
            | translate: { number: index() + 1 }
        "
        [(ngModel)]="option().text"
        [name]="'option-text-' + index()"
      />
      @if (canRemove()) {
        <p-button
          type="button"
          icon="fa-solid fa-xmark"
          [text]="true"
          severity="secondary"
          (click)="remove.emit()"
        />
      }
    </div>

    <div class="tw:ml-0.5">
      @if (showDescription()) {
        <div
          animate.enter="slide-enter"
          animate.leave="slide-leave"
          class="tw:flex tw:items-center tw:gap-2"
        >
          <i class="fa-solid fa-align-left tw:text-primary tw:text-sm"></i>
          <input
            pInputText
            class="tw:flex-1 tw:bg-transparent tw:ml-1"
            style="
              border: none;
              border-bottom: 1px solid #cbd5e1;
              border-radius: 0;
              box-shadow: none;
              padding-left: 0;
              height: 26px;
            "
            pSize="small"
            maxlength="100"
            [placeholder]="
              'project.topicInput.yesNo.optionDescriptionPlaceholder'
                | translate
            "
            #descriptionInput
            [(ngModel)]="option().description"
            [name]="'option-description-' + index()"
            (blur)="onDescriptionBlur()"
          />
        </div>
      }

      @if (showLink()) {
        <div
          animate.enter="slide-enter"
          animate.leave="slide-leave"
          class="tw:flex tw:flex-col tw:gap-1"
        >
          <div class="tw:flex tw:items-center tw:gap-2">
            <i class="fa-solid fa-link tw:text-primary tw:text-sm"></i>
            <input
              pInputText
              class="tw:flex-1 tw:bg-transparent tw:ml-1"
              style="
                border: none;
                border-bottom: 1px solid #cbd5e1;
                border-radius: 0;
                box-shadow: none;
                padding-left: 0;
                height: 26px;
              "
              pSize="small"
              maxlength="2048"
              [placeholder]="
                'project.topicInput.yesNo.urlPlaceholder' | translate
              "
              #linkInput
              [(ngModel)]="option().url"
              [name]="'option-url-' + index()"
              (blur)="onUrlBlur()"
            />
          </div>
          @if (urlError()) {
            <p-message severity="error" class="tw:ml-5">{{
              "project.topicInput.yesNo.urlError" | translate
            }}</p-message>
          }
        </div>
      }

      @if (!showDescription() || !showLink()) {
        <div
          animate.enter="slide-enter"
          animate.leave="slide-leave"
          class="tw:flex tw:items-center tw:gap-3"
          [class.tw:mt-2]="showDescription() || showLink()"
        >
          @if (!showDescription()) {
            <button
              type="button"
              class="tw:flex tw:items-center tw:gap-1 tw:text-sm tw:text-gray-400 tw:cursor-pointer hover:tw:text-primary tw:transition-colors tw:bg-transparent tw:border-0 tw:p-0"
              (click)="toggleDescription()"
            >
              <i class="fa-solid fa-plus" style="font-size: 11px"></i>
              {{ "project.topicInput.yesNo.addDescription" | translate }}
            </button>
          }
          @if (!showLink()) {
            <button
              type="button"
              class="tw:flex tw:items-center tw:gap-1 tw:text-sm tw:text-gray-400 tw:cursor-pointer hover:tw:text-primary tw:transition-colors tw:bg-transparent tw:border-0 tw:p-0"
              (click)="toggleLink()"
            >
              <i class="fa-solid fa-plus" style="font-size: 11px"></i>
              {{ "project.topicInput.yesNo.addLink" | translate }}
            </button>
          }
        </div>
      }
    </div>
  </div>
</app-side-color-card>
