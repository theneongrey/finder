@if (!showContent()) {
  <div
    class="flex"
    [class]="innercss()"
    [style.flex-direction]="flexDirection()"
    [style.gap]="gap()"
    [style.opacity]="skeletonFading() ? '0' : '1'"
    style="transition: opacity 0.3s ease-out"
  >
    @for (item of skeletonArray(); track $index) {
      <div
        class="ds-skeleton"
        [style.width]="skeletonWidth()"
        [style.height]="skeletonHeight()"
      ></div>
    }
  </div>
}
@if (showContent()) {
  <ng-content />
}
