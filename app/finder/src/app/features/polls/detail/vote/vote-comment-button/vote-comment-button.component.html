<hlm-popover sideOffset="5" [state]="popoverOpen()" (stateChanged)="popoverOpen.set($event)">
  <button
    hlmPopoverTrigger
    type="button"
    class="inline-flex items-center gap-1.5 cursor-pointer border-none"
    style="background: transparent; color: var(--text-secondary); font-family: var(--font-body); font-size: var(--fs-ui-sm); font-weight: var(--weight-bold); height: 36px; padding: 0 12px; border-radius: var(--radius-sm);"
  >
    <ds-icon name="comment" [size]="15" color="var(--text-secondary)" />
    {{ 'project.vote.addComment' | translate }}
  </button>
  <hlm-popover-content class="flex flex-col gap-3 min-w-64" *hlmPopoverPortal="let ctx">
    <input
      hlmInput
      type="text"
      [(ngModel)]="commentText"
      [placeholder]="'project.vote.commentPlaceholder' | translate"
      [attr.maxlength]="limits.commentContentLength"
      class="w-full"
    />
    <div class="flex gap-2 justify-end">
      <ds-button variant="ghost" size="sm" (click)="cancelComment()">
        {{ 'project.common.cancel' | translate }}
      </ds-button>
      <ds-button variant="primary" size="sm" (click)="submitComment()">
        {{ 'project.vote.submitComment' | translate }}
      </ds-button>
    </div>
  </hlm-popover-content>
</hlm-popover>
