<div hlmCard>
  <div hlmCardContent>
  <div class="flex items-start gap-2">
    <div class="flex flex-col gap-1 flex-1">
      <label class="text-xs font-semibold text-gray-600">
        {{ "project.pollInput.date.startTime" | translate }}
      </label>
      <p-datepicker
        [timeOnly]="true"
        hourFormat="24"
        [showIcon]="true"
        [stepMinute]="15"
        appendTo="body"
        styleClass="w-full"
        [(ngModel)]="option().startTime"
        [name]="'time-' + index()"
      />
    </div>

    @if (canRemove()) {
      <button hlmBtn type="button" variant="ghost" size="icon" (click)="remove.emit()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    }
  </div>
  </div>
</div>
