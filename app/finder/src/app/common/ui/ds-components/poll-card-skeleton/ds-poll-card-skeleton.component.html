@for (item of items(); track $index) {
    <div
        class="rounded-[var(--radius-3xl)] border border-[rgba(20,24,28,0.055)] bg-white px-5 pt-[18px] pb-5 shadow-[var(--shadow-card-soft)]"
    >
        <div class="flex items-center justify-between">
            <div
                class="shimmer rounded-[var(--radius-sm)]"
                style="width: 104px; height: 20px"
            ></div>
            <div
                class="shimmer rounded-[var(--radius-sm)]"
                style="width: 56px; height: 16px"
            ></div>
        </div>
        <div
            class="shimmer mt-3.5 rounded-[var(--radius-sm)]"
            [style.width]="item.w1"
            style="height: 22px"
        ></div>
        <div
            class="shimmer shimmer--light mt-[9px] rounded-[var(--radius-sm)]"
            [style.width]="item.w2"
            style="height: 13px"
        ></div>
        <div
            class="mt-[18px] h-1.5 w-full rounded-[var(--radius-pill)] bg-[var(--cream-300)]"
        ></div>
        <div class="mt-3.5 flex gap-1.5">
            <div class="shimmer h-[30px] w-[30px] rounded-full"></div>
            <div class="shimmer h-[30px] w-[30px] rounded-full"></div>
            <div class="shimmer h-[30px] w-[30px] rounded-full"></div>
        </div>
        <div class="shimmer mt-4 h-11 rounded-[var(--radius-xl)]"></div>
    </div>
}
