@if (poll(); as poll) {
    <div class="lg:flex">
        <!-- Main column -->
        <div class="min-w-0 lg:flex-1">
            <app-results-toolbar
                [canManage]="canManagePoll()"
                [isClosed]="poll.isClosed"
                [commentsHidden]="!showComments()"
                (closePoll)="closePoll()"
                (reopenPoll)="reopenPoll()"
                (showComments)="showComments.set(true)"
            />

            <div class="flex flex-col gap-4 p-4 pb-8 lg:gap-5 lg:p-6">
                <app-poll-header
                    [name]="poll.name"
                    [description]="poll.description"
                    [isClosed]="poll.isClosed"
                    [typeLabel]="typeLabel()"
                    [statusLabel]="statusLabel()"
                    [closeDateText]="closeDateText()"
                    [commentCount]="poll.comments.length"
                    [sortLabel]="sortLabel()"
                    (toggleSort)="toggleSort()"
                    (edit)="editPoll()"
                />

                <!-- Separator between header and cards -->
                <hr
                    class="h-px border-0"
                    style="background: var(--border-hairline)"
                />

                <app-option-list
                    [options]="poll.options"
                    [optionType]="poll.optionType"
                    [members]="project()?.sharedWith ?? []"
                    [comments]="poll.comments"
                    [projectId]="project()?.id ?? ''"
                    [pollId]="pollId()"
                    [isClosed]="poll.isClosed"
                    [showSortButton]="false"
                    [(sort)]="sortMode"
                />
            </div>
        </div>

        <!-- Comments sidebar (desktop only) -->
        @if (showComments()) {
            <aside
                class="hidden w-[380px] flex-none self-start lg:sticky lg:top-[60px] lg:block lg:h-[calc(100dvh-60px)]"
            >
                <app-comments-section
                    [comments]="poll.comments"
                    (addComment)="addComment($event)"
                    (dismiss)="showComments.set(false)"
                />
            </aside>
        }
    </div>
} @else {
    <div class="flex h-32 items-center justify-center">
        <p style="color: var(--text-secondary)">
            {{ 'project.votesOverview.loading' | translate }}
        </p>
    </div>
}

@if (project(); as project) {
    <app-share-drawer
        [title]="shareDrawerTitle()"
        [subtitle]="shareDrawerSubtitle()"
        [visible]="showShareDrawer()"
        (visibleChange)="showShareDrawer.set($event)"
    >
        <app-share-content
            [projectId]="project.id"
            [sharedWith]="project.sharedWith"
            [visibilityType]="project.visibilityType"
            [inCard]="false"
        />
    </app-share-drawer>
}
