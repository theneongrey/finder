@if (!hideResults()) {
  <!-- Results mode -->
  <div
    class="rounded-[22px] overflow-hidden"
    style="box-shadow: var(--shadow-card-soft)"
    [style.border]="isMostVoted() ? '1px solid rgba(31,122,140,.3)' : '1px solid var(--border-hairline-soft)'"
    [style.background]="'var(--surface-card)'"
  >
    <button
      class="w-full block text-left transition-colors"
      style="border: none; background: transparent; cursor: pointer; padding: 15px 16px 14px"
      (click)="expanded.update(v => !v)"
    >
      <div class="flex items-center gap-2.5">
        <!-- Rank badge -->
        <span
          class="shrink-0 flex items-center justify-center w-6 h-6 rounded-lg text-[12px] font-bold"
          [style.background]="isMostVoted() ? 'var(--accent)' : 'var(--bg-panel, #f1eee9)'"
          [style.color]="isMostVoted() ? 'var(--text-on-accent, #fff)' : 'var(--text-muted)'"
        >
          {{ rank() }}
        </span>

        <!-- Title + description -->
        <span class="flex-1 min-w-0">
          <span class="block text-[15px] font-bold truncate" style="color: var(--text-primary)">
            {{ option().text }}
          </span>
          @if (option().description) {
            <span class="block text-[12.5px] mt-0.5" style="color: var(--text-secondary)">
              {{ option().description }}
            </span>
          }
        </span>

        <!-- Average metric -->
        <span class="shrink-0 text-[15px] font-bold" style="color: var(--warning)">
          {{ avgLabel() }}
        </span>

        <!-- Chevron -->
        <svg
          class="shrink-0 transition-transform"
          [style.transform]="expanded() ? 'rotate(180deg)' : 'rotate(0deg)'"
          width="15" height="15" viewBox="0 0 24 24" fill="none"
          stroke="var(--text-muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        >
          <path d="M6 9.5l6 6 6-6"/>
        </svg>
      </div>

      <!-- Stars display -->
      <div class="flex items-center gap-1.5 mt-2 pl-[34px]">
        @for (star of starsArray; track star) {
          <svg
            width="16" height="16" viewBox="0 0 24 24"
            [attr.fill]="isStarFilled(star) ? 'var(--warning)' : 'none'"
            [attr.stroke]="isStarFilled(star) ? 'var(--warning)' : 'var(--text-muted)'"
            stroke-width="1.5"
          >
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        }
        <span class="text-[12.5px] font-semibold ml-1" style="color: var(--text-secondary)">
          {{ avgLabel() }} von 5
        </span>
      </div>

      <!-- Rating progress bar -->
      <div class="mt-2.5 pl-[34px]">
        <div
          class="h-2 rounded-full overflow-hidden"
          style="background: var(--cream-300, #efece7)"
        >
          <div
            class="h-full rounded-full transition-all"
            style="background: var(--warning)"
            [style.width.%]="progressPercent()"
          ></div>
        </div>
      </div>

      <!-- Avatars + vote line -->
      <div class="flex items-center gap-2 mt-2.5 pl-[34px]">
        @if (avatarUsers().length) {
          <app-avatar-stack [users]="avatarUsers()" [max]="4" size="sm" />
        }
        <span class="flex-1 text-[12.5px] font-semibold truncate" style="color: var(--text-secondary)">
          {{ voteLine() }}
        </span>
      </div>
    </button>

    <!-- Expanded rating breakdown -->
    @if (expanded()) {
      <div class="px-4 pb-4">
        <div class="h-px mb-3" style="background: var(--border-hairline)"></div>
        <div class="flex flex-col gap-2">
          @for (g of groups(); track g.stars) {
            <div class="flex items-start gap-2.5 py-1">
              <span
                class="shrink-0 inline-flex items-center justify-center min-w-[56px] h-6 px-2 rounded-lg text-[11.5px] font-bold"
                [style.background]="g.bg"
                [style.color]="g.fg"
              >
                {{ g.stars }} ★
              </span>
              <span class="text-[13px] leading-[1.5]" style="color: var(--text-secondary)">
                {{ g.names }}
              </span>
            </div>
          }
        </div>
      </div>
    }
  </div>
} @else {
  <!-- Overview mode -->
  <div
    class="rounded-[22px] p-4"
    style="background: var(--surface-card); border: 1px solid var(--border-hairline-soft); box-shadow: var(--shadow-card-soft)"
  >
    <div class="flex flex-col gap-1 mb-3">
      <p class="text-[15px] font-bold" style="color: var(--text-primary)">
        {{ option().text }}
      </p>
      @if (option().description) {
        <p class="text-[13px]" style="color: var(--text-secondary)">
          {{ option().description }}
        </p>
      }
    </div>

    @if (option().choice) {
      <div class="flex justify-end">
        <ds-button
          variant="ghost"
          size="sm"
          [routerLink]="['/polls', projectId(), 'vote', pollId(), option().id]"
        >
          Erneut abstimmen
        </ds-button>
      </div>
    } @else {
      <ds-button
        variant="primary"
        [fullWidth]="true"
        [routerLink]="['/polls', projectId(), 'vote', pollId(), option().id]"
      >
        Abstimmen
      </ds-button>
    }
  </div>
}
