<app-swipe-vote-card
    [enabled]="!deleteConfirm() && !isClosed()"
    mode="date"
    (swiped)="onSwiped($event)"
>
    <div class="group h-full">
        <ds-card [fill]="true" [padding]="0">
            <!-- Body -->
            <div class="flex flex-1 flex-col p-4">
                <!-- Title + menu -->
                <div class="flex items-start gap-2">
                    <div class="min-w-0 flex-1 pt-1">
                        <span
                            class="font-display block text-[19px] leading-[1.2] font-bold tracking-[-0.3px] text-pretty text-[color:var(--text-primary)]"
                            >{{ label() }}</span
                        >
                        @if (subLabel(); as sub) {
                            <span
                                class="mt-0.5 block text-[13px] text-[color:var(--text-secondary)]"
                                >{{ sub }}</span
                            >
                        }
                    </div>
                    <app-option-card-menu [items]="menuItems()" />
                </div>

                <app-option-card-footer
                    [option]="option()"
                    [members]="members()"
                    [summary]="voteLine()"
                    [commentCount]="commentCount()"
                    [isClosed]="isClosed()"
                    [showVoters]="!hideResults()"
                    [deleteConfirm]="deleteConfirm()"
                    (vote)="castVote($event)"
                    (commentsClick)="commentsClick.emit()"
                    (deleteCancelled)="deleteConfirm.set(false)"
                    (deleteConfirmed)="confirmDelete()"
                />
            </div>
        </ds-card>
    </div>
</app-swipe-vote-card>
