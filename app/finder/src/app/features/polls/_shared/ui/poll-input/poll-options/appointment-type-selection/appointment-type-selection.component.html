<div class="flex flex-col gap-3">
  <span class="text-sm font-semibold px-1">
    {{ "project.pollInput.date.appointmentTypeLabel" | translate }}
  </span>

  @if (selectedType() && !isEditing()) {
    <div
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl border border-gray-200 bg-white"
    >
      <i
        class="{{
          selectedTypeInfo()!.icon
        }} text-primary text-lg w-5 text-center"
      ></i>
      <span class="text-sm font-medium text-gray-700 flex-1">
        {{ selectedTypeInfo()!.labelKey | translate }}
      </span>
      <button
        type="button"
        class="text-sm text-white bg-primary cursor-pointer border-0 px-3 py-1 rounded-lg hover:opacity-80 transition-opacity"
        (click)="isEditing.set(true)"
      >
        {{ "project.pollInput.date.changeType" | translate }}
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-3 gap-2">
      @for (t of types; track t.type) {
        <button
          type="button"
          [class]="
            t.type === selectedType()
              ? 'flex flex-col items-center gap-2 p-4 rounded-xl border border-primary bg-app-gradient cursor-pointer transition-colors text-primary text-sm font-medium'
              : 'flex flex-col items-center gap-2 p-4 rounded-xl border border-gray-200 bg-white cursor-pointer hover:border-primary hover:text-primary transition-colors text-gray-600 text-sm font-medium'
          "
          (click)="onTypeClick(t.type)"
        >
          <i class="{{ t.icon }} text-xl"></i>
          {{ t.labelKey | translate }}
        </button>
      }
    </div>
  }
</div>
