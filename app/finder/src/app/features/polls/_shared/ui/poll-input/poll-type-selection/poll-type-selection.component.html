<div class="px-[18px] py-[22px] pb-10">
  <h1>{{ 'project.pollInput.typeTitle' | translate }}</h1>
  <p class="mt-[7px] text-pretty" style="font-size:var(--fs-body-xs);color:var(--text-secondary)">
    {{ 'project.pollInput.typeSub' | translate }}
  </p>

  <div class="flex flex-col gap-3 mt-5">
    <button type="button" class="type-btn" (click)="typeSelected.emit(OptionType.Date)">
      <span class="type-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="15.5" rx="3.2"></rect>
          <path d="M3.5 10h17"></path><path d="M8 3.5v3"></path><path d="M16 3.5v3"></path>
        </svg>
      </span>
      <span class="flex flex-col flex-1 min-w-0 text-left">
        <span class="type-name">{{ 'project.detail.pollTypes.appointment' | translate }}</span>
        <span class="type-desc">{{ 'project.detail.pollTypes.appointmentDesc' | translate }}</span>
      </span>
      <span class="type-radio"></span>
    </button>

    <button type="button" class="type-btn" (click)="typeSelected.emit(OptionType.YesNo)">
      <span class="type-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
          <path d="M8 12.4l2.8 2.8L16.5 9.5"></path>
        </svg>
      </span>
      <span class="flex flex-col flex-1 min-w-0 text-left">
        <span class="type-name">{{ 'project.detail.pollTypes.yesNo' | translate }}</span>
        <span class="type-desc">{{ 'project.detail.pollTypes.yesNoDesc' | translate }}</span>
      </span>
      <span class="type-radio"></span>
    </button>

    <button type="button" class="type-btn" (click)="typeSelected.emit(OptionType.Rating)">
      <span class="type-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.8l2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.9l5.9-.8z"></path>
        </svg>
      </span>
      <span class="flex flex-col flex-1 min-w-0 text-left">
        <span class="type-name">{{ 'project.detail.pollTypes.rating' | translate }}</span>
        <span class="type-desc">{{ 'project.detail.pollTypes.ratingDesc' | translate }}</span>
      </span>
      <span class="type-radio"></span>
    </button>
  </div>

  <div class="flex items-start gap-[9px] mt-[18px] px-[14px] py-[13px]"
    style="border-radius:var(--radius-lg);background:rgba(255,255,255,.55);border:1px solid var(--border-hairline-soft)">
    <svg width="16" height="16" style="flex:none;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.6"></circle>
      <path d="M12 11v5.4"></path><path d="M12 7.9v.1"></path>
    </svg>
    <span style="font-size:var(--fs-caption);line-height:var(--leading-normal);color:var(--text-secondary)">
      {{ 'project.detail.pollTypes.hint' | translate }}
    </span>
  </div>
</div>
