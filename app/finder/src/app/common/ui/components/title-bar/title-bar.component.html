@if (!isHidden()) {
  <header
    class="tw:mx-auto tw:w-full tw:flex tw:h-15 tw:p-2 tw:gap-2 tw:bg-gradient-to-b tw:from-white tw:from-75% tw:to-[#86bba1]/0"
  >
    @if (this.backRoute()) {
      <p-button
        icon="fa-solid fa-arrow-left"
        [routerLink]="[this.backRoute()]"
        [text]="true"
      />

      @if (!titleDisabled()) {
        <app-loading
          [isLoading]="title() === undefined"
          skeletonWidth="8rem"
          skeletonHeight="1.5rem"
          innercss="tw:my-auto tw:relative tw:top-[3px]"
        >
          <h1
            class="tw:my-auto tw:text-headline-md tw:font-bold tw:text-primary-dark tw:relative tw:top-[2px]"
          >
            {{ title() }}
          </h1>
        </app-loading>
      }
    } @else {
      <a href="/" class="tw:my-auto tw:ml-[5px]">
        <img
          alt="logo"
          ngSrc="logo-primary.svg"
          width="98"
          height="26"
          class="tw:mx-auto tw:mt-auto icon"
        />
      </a>
    }

    @if (user()?.isAuthenticated) {
      <app-user-avatar
        class="tw:my-auto tw:mr-0 tw:ml-auto"
        [user]="user()!"
        (click)="menu.toggle($event)"
      />
      <p-menu #menu [model]="items()" [popup]="true" appendTo="body" />
    }
  </header>
}
