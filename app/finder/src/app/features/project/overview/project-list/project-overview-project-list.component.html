<div class="tw:flex tw:bg-red-50 tw:h-full tw:flex-col tw:p-5">
  <p-dataview #dv [value]="projects()">
    <ng-template #list let-projects>
      <h4 class="tw:mb-5">Projects</h4>

      @for (project of projects; track project.id) {
        <div class="tw:flex tw:h-8 tw:cursor-pointer hover:tw:bg-sky-700 hover:tw:text-white" [routerLink]="['/project/detail', project.id]">
          <div class="tw:w-[400px]">
            {{ project.name }}
          </div>
          <div class="tw:w-[200px]">
            Topics: {{ project.topicCount }}
          </div>
          <div class="tw:w-[400px]">
            Role: {{ project.role | projectRoleToName }}
          </div>
          <div class="tw:w-[400px]">
            Creator: {{ project.creator }}
          </div>
          <div class="tw:ml-auto tw:mr-0">
            <p-button icon="pi pi-trash" (click)="showDeleteDialog($event, project.id, project.name)"/>
          </div>
        </div>
      }
    </ng-template>
  </p-dataview>

</div>

<p-confirmdialog />
