<div class="flex flex-col w-full">
  <app-title-bar />
  <main class="flex-grow mx-auto w-full max-w-(--mobile-max-width) lg:max-w-none rounded-t-2xl px-[22px] pt-5 lg:pt-0">
    <app-standalone-poll-tab
      (deletionRequested)="pollDeletionRequested($event)"
      (shareRequested)="pollShareRequested($event)"
    />
  </main>
</div>

<!-- FAB — mobile only -->
<button
  class="lg:hidden fixed bottom-6 right-5 z-50 w-[58px] h-[58px] rounded-full border-none flex items-center justify-center cursor-pointer"
  style="background: var(--accent); box-shadow: var(--shadow-fab); color: #fff; transition: transform var(--duration-fast) var(--ease-standard)"
  [routerLink]="['/polls/add']"
  title="Neue Umfrage"
  data-testid="fab-add-poll"
>
  <ds-icon name="plus" [size]="24" color="#fff" />
</button>

@if (sharingProject(); as project) {
  <app-share-drawer
    [title]="shareDrawerTitle()"
    [subtitle]="shareDrawerSubtitle()"
    [visible]="!!sharingProjectId()"
    (visibleChange)="shareDrawerVisibilityChanged($event)"
  >
    <app-share-content
      [projectId]="project.projectId"
      [sharedWith]="project.sharedWith"
      [visibilityType]="project.visibilityType"
    />
  </app-share-drawer>
}
