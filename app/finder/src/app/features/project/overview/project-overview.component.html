<div class="tw:flex tw:h-full tw:max-h-full tw:flex-col tw:mx-4">
  <section class="tw:mb-5">
    <h2>Projects</h2>
    <p class="tw:text-on-surface-variant">These are your current projects</p>
  </section>
  <div class="tw:grid tw:gap-4 tw:grid-cols-auto-fit tw:pb-8">
    @for (project of projects(); track project.id) {
      <app-side-color-card
        color="primary"
        class="tw:cursor-pointer"
        [routerLink]="['/project/detail', project.id]"
      >
        <p-tag class="tw:-ml-[2px]">by {{ project.creator }}</p-tag>
        <p class="p-card-title tw:mb-4 tw:mt-1">{{ project.name }}</p>
        <p class="tw:text-on-surface-variant tw:mb-2">Descritption here</p>
        <p class="tw:opacity-60 tw:mx-auto tw:mt-1">
          {{ project.lastUpdated | timeSince }}
        </p>
      </app-side-color-card>
    }
    <p-button
      class="tw:right-4 tw:fixed tw:bottom-4"
      icon="pi pi-plus"
      [routerLink]="['/project/add']"
      pTooltip="Add project"
    />
  </div>
</div>

<p-dialog
  header="New Project"
  [modal]="true"
  [(visible)]="showAddProjectDialog"
  [style]="{ width: '25rem' }"
>
  <span class="p-text-secondary tw:block tw:mb-8"
    >A project is a collection of things to decide, like a &quot;Birthday
    party&quot;</span
  >
  <div class="tw:mb-5 tw:mt-5">
    <p-floatlabel variant="on">
      <label for="name">Name</label>
      <input
        pInputText
        id="name"
        class="tw:w-full"
        autocomplete="off"
        [(ngModel)]="projectName"
      />
    </p-floatlabel>
  </div>
  <div class="tw:flex tw:justify-end tw:gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (click)="showAddProjectDialog.set(false)"
    />
    <p-button
      label="Add Project"
      (click)="addProject()"
      [disabled]="!projectName()"
    />
  </div>
</p-dialog>
