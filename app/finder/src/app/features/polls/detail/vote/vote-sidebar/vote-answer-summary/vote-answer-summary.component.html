<div class="flex flex-col gap-0.5">
  @for (item of items(); track item.id) {
    <button
      type="button"
      (click)="itemClick.emit(item.id)"
      class="flex w-full cursor-pointer items-center gap-[10px] rounded-[11px] border-none text-left"
      style="
        padding: 9px 10px;
        transition: background var(--duration-fast) var(--ease-standard);
      "
      [style.background]="item.rowBg"
    >
      <span
        class="flex-none rounded-full"
        style="width: 6px; height: 6px; flex-shrink: 0"
        [style.background]="item.dotBg"
      ></span>
      <span
        class="min-w-0 flex-1 truncate"
        style="font-size: 13.5px; color: var(--text-primary)"
        [style.font-weight]="item.fontWeight"
      >
        {{ item.label }}
      </span>
      <span
        class="inline-flex flex-none items-center rounded-[8px]"
        style="height: 23px; padding: 0 8px; font-size: 11.5px; font-weight: var(--weight-bold);"
        [style.background]="item.badgeBg"
        [style.color]="item.badgeFg"
      >
        @if (item.ratingValue > 0) {
          {{ item.ratingValue }} ★
        } @else {
          {{ item.badgeKey | translate }}
        }
      </span>
    </button>
  }
</div>
