<div
  class="pointer-events-none flex flex-col items-center w-full"
>
  <hlm-calendar-range
    [startDate]="startDate()"
    [endDate]="endDate()"
    [weekStartsOn]="1"
  />

  @if (entry().date && entry().endDate) {
    <div class="flex flex-col items-center gap-1 text-center">
      <p class="font-semibold">
        {{ formatDate(entry().date!) }}
        @if (entry().startTime; as t) {
          <span class="mx-1">–</span>{{ formatTimeOnly(t) }}
        }
      </p>
      <div class="flex items-center">
        <i class="fa-solid fa-arrow-down"></i>
      </div>
      <p class="font-semibold">
        {{ formatDate(entry().endDate!) }}
        @if (entry().endTime; as e) {
          <span class="mx-1">–</span>{{ formatTimeOnly(e) }}
        }
      </p>
    </div>
  }
</div>
