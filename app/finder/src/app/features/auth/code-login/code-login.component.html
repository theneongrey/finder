<!-- Progress dots: steps 1 + 2 active -->
<div class="flex gap-[7px] mb-[16px]">
  <span class="h-[4px] flex-1 rounded-full bg-[var(--accent)]"></span>
  <span class="h-[4px] flex-1 rounded-full bg-[var(--accent)]"></span>
  <span class="h-[4px] flex-1 rounded-full bg-[var(--sand-200)]"></span>
</div>

<form
  [formGroup]="form"
  (ngSubmit)="verifyCode()"
  class="flex flex-col gap-0"
>
  <div class="[font-family:var(--font-display)] text-[27px] lg:text-[30px] font-bold tracking-[-0.6px] lg:tracking-[-0.7px] leading-[1.1] [color:var(--text-primary)]">
    {{ 'auth.codeLogin.heading' | translate }}
  </div>
  <p class="mt-[8px] text-[14.5px] lg:text-[15px] leading-[1.45] [color:var(--text-secondary)] text-pretty">
    {{ 'auth.codeLogin.codeSentBefore' | translate }}
    <strong class="[color:var(--text-body)] font-bold">{{ email() }}</strong>{{ 'auth.codeLogin.codeSentAfter' | translate }}
  </p>

  <div class="mt-[22px]">
    <ds-input-otp formControlName="code" [length]="6" [groupSize]="3" />
  </div>

  @if (hasError()) {
    <div class="flex items-center gap-[6px] pt-[10px] text-[13px] font-semibold [color:var(--negative)]">
      <ds-icon name="warning" [size]="14" color="var(--negative)" />
      <span>{{ 'auth.codeLogin.invalidCode' | translate }}</span>
    </div>
  }

  <div class="mt-[16px]">
    <ds-button
      variant="primary"
      [fullWidth]="true"
      [disabled]="form.invalid"
    >
      {{ 'auth.codeLogin.submit' | translate }}
    </ds-button>
  </div>
</form>

<div class="mt-[14px]">
  <button
    type="button"
    class="border-none bg-transparent px-[2px] py-[4px] text-[13.5px] font-bold [color:var(--text-secondary)] cursor-pointer hover:[color:var(--text-primary)] transition-colors duration-[140ms]"
    (click)="editEmail()"
  >
    {{ 'auth.codeLogin.changeEmail' | translate }}
  </button>
</div>
