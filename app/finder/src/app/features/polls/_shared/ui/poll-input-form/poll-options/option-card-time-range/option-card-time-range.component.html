<ds-card [accentBorder]="false" [padding]="14">
  <div class="flex items-start gap-2">
    <div class="flex flex-1 flex-col gap-2">
      <div class="flex flex-col gap-1">
        <label
          class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
        >
          {{ "project.pollInput.date.startTime" | translate }}
        </label>
        <ds-input
          type="time"
          [ngModel]="startTimeValue"
          (ngModelChange)="onStartTimeChange($event)"
          [name]="'time-range-start-' + index()"
          [readonly]="readonly()"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
        >
          {{ "project.pollInput.date.endTime" | translate }}
        </label>
        <ds-input
          type="time"
          [ngModel]="endTimeValue"
          (ngModelChange)="setEndTime($event)"
          [name]="'time-range-end-' + index()"
          [readonly]="readonly()"
        />
      </div>
    </div>

    @if (canRemove()) {
      <ds-button
        [size]="32"
        variant="ghost"
        icon="close"
        (click)="remove.emit()"
      />
    }
  </div>
</ds-card>
