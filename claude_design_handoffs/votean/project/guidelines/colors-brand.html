<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;}
.row{display:flex;gap:10px;}
.sw{flex:1;height:64px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:700;font-family:monospace;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--teal-900);color:#fff;">--teal-900</div>
  <div class="sw" style="background:var(--teal-300);color:#1d2227;">--teal-300</div>
  <div class="sw" style="background:var(--teal-200);color:#1d2227;">--teal-200</div>
  <div class="sw" style="background:var(--teal-150);color:#1d2227;">--teal-150</div>
  <div class="sw" style="background:var(--teal-100);color:#1d2227;">--teal-100</div>
  <div class="sw" style="background:var(--teal-alt-bg);color:var(--teal-alt-fg);">alt-bg/fg</div>
</div>
</body></html>
