<p class="label mb-2">{{ 'project.share.whoCanJoin' | translate }}</p>

<ds-segmented-control
    [options]="visibilityOptions()"
    [value]="selectedVisibility()"
    (valueChange)="visibilityChange.emit($event)"
/>

<p class="mt-[9px] px-3 pb-1 text-[12.5px] text-[var(--text-secondary)]">
    @if (isPublic()) {
        {{ 'project.share.openDescription' | translate }}
    } @else {
        {{ 'project.share.inviteOnlyDescription' | translate }}
    }
</p>

<div class="link-card-outer" [class.link-card-outer--open]="isPublic()">
    <div
        class="mt-3 flex items-center gap-2 rounded-[16px] border border-[var(--border-hairline-soft)] bg-white px-3 py-2"
        style="box-shadow: var(--shadow-card-soft)"
    >
        <span
            class="min-w-0 flex-1 overflow-hidden text-sm text-ellipsis whitespace-nowrap text-[var(--text-secondary)]"
            >{{ shareLink() }}</span
        >
        <ds-button
            variant="primary"
            size="sm"
            [noGlow]="true"
            (click)="copyLink()"
            >{{ 'project.share.copy' | translate }}</ds-button
        >
    </div>
    <div class="mt-[9px] flex items-start gap-2 px-0.5">
        <span class="mt-px shrink-0">
            <ds-icon name="info" [size]="14" color="var(--text-muted)" />
        </span>
        <span
            class="leading-relaxed text-[var(--text-secondary)]"
            style="font-size: var(--fs-caption)"
            >{{ 'project.share.linkNote' | translate }}</span
        >
    </div>
</div>
