<hlm-sheet [state]="visible() ? 'open' : 'closed'" side="bottom" (stateChanged)="visible.set($event === 'open')">
  <hlm-sheet-content class="!h-auto rounded-t-2xl px-[22px] pb-[26px]" *hlmSheetPortal>
    <div hlmSheetHeader class="!px-0">
      <h3 hlmSheetTitle>{{ ('project.share.title' | translate) + ' – ' + projectName() }}</h3>
    </div>
    <app-share-content
      [projectId]="projectId()"
      [sharedWith]="sharedWith()"
      [visibilityType]="visibilityType()"
    />
  </hlm-sheet-content>
</hlm-sheet>
