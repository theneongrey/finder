<!-- Progress dots: step 1 active -->
<div class="flex" style="gap: 7px; margin-bottom: 16px">
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--accent)"
  ></span>
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--sand-200)"
  ></span>
  <span
    style="height: 4px; flex: 1; border-radius: 99px; background: var(--sand-200)"
  ></span>
</div>

<form
  [formGroup]="form"
  (ngSubmit)="sendLoginMail()"
  class="flex flex-col"
  style="gap: 0"
>
  <div
    style="
      font-family: var(--font-display);
      font-size: var(--fs-display-md);
      font-weight: var(--weight-bold);
      letter-spacing: -0.6px;
      line-height: 1.1;
      color: var(--text-primary);
    "
  >
    Schön, dass du da bist
  </div>
  <p
    style="
      margin: 8px 0 0;
      font-size: var(--fs-body-sm);
      line-height: 1.45;
      color: var(--text-secondary);
      text-wrap: pretty;
    "
  >
    Gib deine E-Mail-Adresse ein – wir schicken dir einen Anmeldecode.
    Kein Passwort nötig.
  </p>

  <div style="margin-top: 20px">
    <ds-input
      formControlName="email"
      label="E-Mail-Adresse"
      placeholder="name@beispiel.de"
      [error]="errorMessage()"
    />
  </div>

  <div style="margin-top: 18px">
    <ds-button
      variant="primary"
      [fullWidth]="true"
      trailingIcon="arrow-right"
      [disabled]="form.invalid"
      [loading]="isLoading()"
    >
      Code senden
    </ds-button>
  </div>

  <p
    style="
      margin: 14px 0 0;
      font-size: var(--fs-caption);
      line-height: 1.5;
      color: var(--text-muted);
      text-align: center;
      text-wrap: pretty;
    "
  >
    Neu hier? Mit der E-Mail wird automatisch dein Konto angelegt.
  </p>
</form>
