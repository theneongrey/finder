name: CI-Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install Playwright browsers
        working-directory: ./api
        run: |
          dotnet build --configuration Release
          pwsh Finder/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Run backend tests
        run: dotnet test --configuration Release
        working-directory: ./api

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Check Node version matches Dockerfile
        run: |
          nvmrc=$(tr -d '[:space:]' < app/finder/.nvmrc)
          docker=$(sed -nE 's/^FROM node:([0-9.]+).*/\1/p' app/finder/Dockerfile | head -n1)
          echo ".nvmrc: $nvmrc | Dockerfile: $docker"
          if [ "$nvmrc" != "$docker" ]; then
            echo "::error file=app/finder/Dockerfile::Node version mismatch: .nvmrc=$nvmrc, Dockerfile=node:$docker"
            exit 1
          fi

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: app/finder/.nvmrc
          cache: npm
          cache-dependency-path: app/finder/package-lock.json

      - name: npm ci, build
        working-directory: ./app/finder
        run: |
          npm ci
          npm run build:production

      - name: Build with dotnet
        run: dotnet build --configuration Release
        working-directory: ./api
