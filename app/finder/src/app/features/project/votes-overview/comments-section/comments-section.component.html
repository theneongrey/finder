<div>
  <h3 id="comments-section">{{ 'project.votesOverview.comments' | translate }}</h3>
  <div
    class="tw:bg-white tw:rounded-2xl tw:p-4 tw:shadow-sm tw:border tw:border-gray-100"
  >
    <div class="tw:flex tw:flex-col tw:gap-3 tw:mb-4">
      @for (comment of comments(); track comment.author) {
        <div class="tw:flex tw:gap-2">
          <div
            class="tw:w-8 tw:h-8 tw:rounded-full tw:bg-primary tw:text-white tw:flex tw:items-center tw:justify-center tw:text-sm tw:font-bold tw:shrink-0"
          >
            {{ comment.initials }}
          </div>
          <div
            class="tw:bg-gray-50 tw:p-3 tw:rounded-2xl tw:rounded-tl-none tw:flex-1"
          >
            <p class="tw:text-sm tw:font-bold tw:text-gray-900">
              {{ comment.author }}
            </p>
            <p class="tw:text-sm tw:text-gray-600">{{ comment.text }}</p>
            <span
              class="tw:text-[10px] tw:text-gray-400 tw:mt-1 tw:uppercase tw:tracking-wider tw:font-semibold tw:block"
              >{{ comment.time }}</span
            >
          </div>
        </div>
      }
    </div>

    <p-inputgroup>
      <input
        pInputText
        type="text"
        [placeholder]="'project.votesOverview.newComment' | translate"
      />
      <p-button icon="pi pi-send" />
    </p-inputgroup>
  </div>
</div>
