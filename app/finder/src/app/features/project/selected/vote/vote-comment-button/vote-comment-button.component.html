<hlm-popover sideOffset="5" [state]="popoverOpen()" (stateChanged)="popoverOpen.set($event)">
  <button
    hlmPopoverTrigger
    type="button"
    class="inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-700 shadow-sm hover:bg-gray-50"
  >
    <i class="fa-regular fa-comment"></i>
    {{ 'project.vote.addComment' | translate }}
  </button>
  <hlm-popover-content class="flex flex-col gap-3 min-w-64" *hlmPopoverPortal="let ctx">
    <input
      hlmInput
      type="text"
      [(ngModel)]="commentText"
      [placeholder]="'project.vote.commentPlaceholder' | translate"
      class="w-full"
    />
    <div class="flex gap-2 justify-end">
      <p-button
        [label]="'project.common.cancel' | translate"
        severity="secondary"
        variant="text"
        size="small"
        (click)="cancelComment()"
      />
      <p-button
        [label]="'project.vote.submitComment' | translate"
        size="small"
        (click)="submitComment()"
      />
    </div>
  </hlm-popover-content>
</hlm-popover>
