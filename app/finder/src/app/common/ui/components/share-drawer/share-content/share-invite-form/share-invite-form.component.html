<p
  class="tw:text-xs tw:font-semibold tw:uppercase tw:tracking-wide tw:text-gray-500 tw:mt-4 tw:mb-2"
>
  {{ "project.share.invite" | translate }}
</p>

<div class="tw:flex tw:gap-2">
  @if (contacts().length > 0) {
    <p-select
      fluid
      [editable]="true"
      [options]="contacts()"
      [ngModel]="contactEmail()"
      (ngModelChange)="contactEmail.set($event)"
      optionLabel="email"
      optionValue="email"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [disabled]="sharingInProgress()"
      class="tw:flex-1"
    >
      <ng-template #item let-contact>
        <div class="tw:flex tw:items-center tw:gap-2">
          <p-avatar
            [image]="contact.picture ?? undefined"
            [label]="
              contact.picture ? undefined : contact.name[0].toUpperCase()
            "
            shape="circle"
          />
          <div>
            <div class="tw:font-medium tw:text-sm">{{ contact.name }}</div>
            <div class="tw:text-xs tw:text-gray-500">{{ contact.email }}</div>
          </div>
        </div>
      </ng-template>
    </p-select>
  } @else {
    <input
      pInputText
      fluid
      type="email"
      autocomplete="off"
      [ngModel]="contactEmail()"
      (ngModelChange)="contactEmail.set($event)"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [disabled]="sharingInProgress()"
      class="tw:flex-1"
    />
  }
  <p-button
    icon="pi pi-send"
    [loading]="sharingInProgress()"
    [disabled]="!contactEmail()"
    (click)="invite()"
  />
</div>

<p-select-button
  fluid
  [allowEmpty]="false"
  [options]="roleOptions()"
  [ngModel]="selectedRole()"
  (ngModelChange)="selectedRole.set($event)"
  optionLabel="label"
  optionValue="id"
  class="tw:mt-4"
/>

<p class="tw:text-sm tw:text-gray-500 tw:mt-2">
  {{ selectedRoleDescription() }}
</p>
