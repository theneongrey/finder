<button
    hlmBtn
    [disabled]="disabled() || loading()"
    [attr.aria-label]="label() ?? null"
    [style.width]="widthStyle()"
    [style.height]="heightStyle()"
    [style.color]="color() ?? null"
    [class]="variantClass()"
    [class.ds-btn--no-glow]="noGlow()"
    class="ds-btn inline-flex max-w-full cursor-pointer items-center justify-center gap-2 overflow-hidden [font-family:var(--font-body)] font-bold! whitespace-nowrap outline-none"
>
    @if (loading()) {
        <span class="ds-btn__spinner"></span>
    } @else if (icon()) {
        <ds-icon [name]="icon()!" [size]="iconSize()" />
    }
    <ng-content />
    @if (!loading() && trailingIcon()) {
        <ds-icon [name]="trailingIcon()!" [size]="iconSize()" />
    }
</button>
