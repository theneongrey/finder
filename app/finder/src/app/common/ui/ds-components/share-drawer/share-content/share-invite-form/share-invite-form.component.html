<p class="label mb-2">{{ 'project.share.personInvite' | translate }}</p>

<div class="relative">
  <div class="flex gap-2">
    <ds-input
      class="flex-1"
      type="text"
      autocomplete="off"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [ngModel]="contactEmail() ?? ''"
      (ngModelChange)="onEmailInput($event)"
      [readonly]="sharingInProgress()"
    />
    <ds-button
      icon="send"
      variant="primary"
      [size]="44"
      [disabled]="!contactEmail()"
      [loading]="sharingInProgress()"
      (click)="invite()"
    />
  </div>

  @if (dropdownVisible() && filteredContacts().length > 0) {
    <div class="absolute top-full left-0 right-0 z-20 mt-1 overflow-hidden rounded-[var(--radius-xl)] border border-[var(--border-hairline-soft)] bg-white shadow-lg">
      @for (c of filteredContacts(); track c.email) {
        <button
          class="flex w-full items-center gap-3 px-4 py-2.5 text-left transition-colors hover:bg-[var(--sand-100)]"
          type="button"
          (click)="selectContact(c)"
        >
          <span
            class="flex size-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
            style="background: var(--accent-tint); color: var(--accent)"
          >{{ c.name[0]?.toUpperCase() }}</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium">{{ c.name }}</p>
            <p class="truncate text-xs text-[var(--text-muted)]">{{ c.email }}</p>
          </div>
        </button>
      }
    </div>
  }
</div>

<p class="label mb-2 mt-5">{{ 'project.share.roleLabel' | translate }}</p>

<ds-segmented-control
  [options]="roleOptions()"
  [value]="selectedRole()"
  (valueChange)="selectedRole.set($event)"
/>

<p class="mt-1.5 text-sm text-[var(--text-secondary)]">{{ selectedRoleDescription() }}</p>
