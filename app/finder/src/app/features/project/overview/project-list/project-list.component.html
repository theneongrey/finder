<div class="tw-flex tw-bg-red-50 tw-h-full tw-flex-col tw-p-5">
  @for (project of projects(); track project.id) {
    <div class="tw-flex tw-h-8">
      <div>
        {{ project.name }}
      </div>
      <div class="tw-ml-auto tw-mr-0">
        <p-button icon="pi pi-trash" (click)="confirm(project.id, project.name)"/>
      </div>
    </div>
  }
</div>

<p-toast />
<p-confirmdialog />
