<div
    [class]="
        inCard()
            ? 'mt-3.5 rounded-[22px] border border-[var(--border-hairline-soft)] bg-white p-4'
            : 'mt-2'
    "
    [style.box-shadow]="inCard() ? 'var(--shadow-card-soft)' : null"
>
    @if (!hideTabs() && tabItems().length > 1) {
        <ds-tabs
            [items]="tabItems()"
            [value]="activeTab()"
            (valueChange)="activeTab.set($event)"
        />
    }

    @if (hideTabs() || activeTab() === 'invite') {
        <div [class.mt-[18px]]="!hideTabs() && tabItems().length > 1">
            <app-share-access-tab
                [visibilityOptions]="visibilityOptions()"
                [selectedVisibility]="selectedVisibilityStr()"
                [isPublic]="isPublic()"
                [shareLink]="shareLink()"
                (visibilityChange)="onVisibilityChange($event)"
            />
            <app-share-invite-form
                class="mt-3.5 block"
                [projectId]="projectId()"
                [contacts]="sharingContacts()"
                [sharingInProgress]="sharingInProgress()"
                [excludedEmails]="sharedWithEmails()"
            />
        </div>
    }

    @if (!hideTabs() && activeTab() === 'members') {
        <div class="mt-[18px]">
            <app-share-members-list
                [projectId]="projectId()"
                [members]="sharedWith()"
                [isPublic]="isPublic()"
                (goInvite)="activeTab.set('invite')"
            />
        </div>
    }
</div>
