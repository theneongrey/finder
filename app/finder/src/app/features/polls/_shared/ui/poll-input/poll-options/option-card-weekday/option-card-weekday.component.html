<ds-card [accentBorder]="false" [padding]="14">
  <div class="flex flex-col gap-3">
    <div class="flex items-start gap-2">
      <div class="flex flex-col gap-2 flex-1">
        <div class="flex gap-1">
          @for (day of weekdayButtons; track day.value) {
            <button
              type="button"
              [class.cursor-pointer]="!readonly()"
              [class.cursor-default]="readonly()"
              style="flex:1;padding:6px 2px;border-radius:8px;font-size:var(--fs-caption-sm);font-weight:var(--weight-bold);border:none;transition:background var(--duration-fast) ease,color var(--duration-fast) ease"
              [style.background]="option().weekday === day.value ? 'var(--accent)' : 'var(--bg-panel)'"
              [style.color]="option().weekday === day.value ? 'white' : 'var(--text-secondary)'"
              [disabled]="readonly()"
              (click)="!readonly() && selectWeekday(day.value)"
              [attr.aria-label]="day.ariaLabel"
              [attr.aria-pressed]="option().weekday === day.value"
            >
              {{ day.label }}
            </button>
          }
        </div>

        @if (showTime()) {
          <div class="flex flex-col gap-1">
            <label style="font-size:var(--fs-caption);font-weight:var(--weight-bold);color:var(--text-secondary)">
              {{ 'project.pollInput.date.startTime' | translate }}
            </label>
            <ds-input
              type="time"
              [ngModel]="timeValue"
              (ngModelChange)="setStartTime($event)"
              [name]="'weekday-time-' + index()"
              [readonly]="readonly()"
            />
          </div>
        }
      </div>

      @if (canRemove()) {
        <ds-button [size]="32" variant="ghost" icon="close" (click)="remove.emit()" />
      }
    </div>
  </div>
</ds-card>
