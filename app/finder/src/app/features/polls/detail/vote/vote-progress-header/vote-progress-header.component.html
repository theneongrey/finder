<div class="px-5 pt-3 md:px-8 md:pt-0">
  <div class="mx-auto w-full" style="max-width: 560px">
    <!-- Type badge + deadline row — mobile only -->
    <div class="mb-3 flex items-center justify-between gap-2 md:hidden">
      <app-poll-type-badge [type]="optionType()" />
      @if (closeDateDisplay()) {
        <span
          class="flex items-center gap-1.5"
          style="
            font-size: 12.5px;
            font-weight: var(--weight-semibold);
            color: var(--text-secondary);
          "
        >
          <ds-icon name="clock" [size]="13" />
          {{ closeDateDisplay() }}
        </span>
      }
    </div>

    <div class="mb-2 flex items-baseline justify-between gap-2">
      <span
        style="
          font-size: 13px;
          font-weight: var(--weight-bold);
          color: var(--text-primary);
        "
      >
        {{
          "project.vote.optionProgress"
            | translate: { current: currentIndex() + 1, total: total() }
        }}
      </span>
      <span
        style="
          font-size: 12px;
          font-weight: var(--weight-semibold);
          color: var(--text-muted);
        "
      >
        {{ progressPercent() }}&thinsp;%
      </span>
    </div>

    <!-- Segmented bar — one segment per option -->
    <div class="flex gap-1">
      @for (seg of progressSegments(); track $index) {
        <span
          class="flex-1 rounded-full"
          style="height: 5px; transition: background 260ms ease"
          [style.background]="seg"
        ></span>
      }
    </div>
  </div>
</div>
