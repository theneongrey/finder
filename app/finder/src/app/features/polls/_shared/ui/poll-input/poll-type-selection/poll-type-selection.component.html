<div>
  <div [class]="layout() === 'grid'
    ? 'grid grid-cols-3 gap-4 mt-0 max-w-[940px]'
    : 'flex flex-col gap-3 mt-0'">

    <!-- Yes / No -->
    <button
      type="button"
      [class]="'type-btn' + (selectedType() === OptionType.YesNo ? ' type-btn--selected' : '') + (layout() === 'grid' ? ' type-btn--grid' : '')"
      data-testid="type-btn-yesno"
      (click)="typeSelected.emit(OptionType.YesNo)"
    >
      @if (layout() === 'grid') {
        <span class="flex items-center justify-between w-full">
          <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.YesNo">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
              <path d="M8 12.4l2.8 2.8L16.5 9.5"></path>
            </svg>
          </span>
          <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.YesNo">
            @if (selectedType() === OptionType.YesNo) {
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 12.5l4.5 4.5L20 5"></path>
              </svg>
            }
          </span>
        </span>
        <span>
          <span class="type-name">{{ 'project.detail.pollTypes.yesNo' | translate }}</span>
          <span class="type-desc type-desc--grid">{{ 'project.detail.pollTypes.yesNoDesc' | translate }}</span>
        </span>
      } @else {
        <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.YesNo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
            <path d="M8 12.4l2.8 2.8L16.5 9.5"></path>
          </svg>
        </span>
        <span class="flex flex-col flex-1 min-w-0 text-left">
          <span class="type-name">{{ 'project.detail.pollTypes.yesNo' | translate }}</span>
          <span class="type-desc">{{ 'project.detail.pollTypes.yesNoDesc' | translate }}</span>
        </span>
        <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.YesNo">
          @if (selectedType() === OptionType.YesNo) {
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 12.5l4.5 4.5L20 5"></path>
            </svg>
          }
        </span>
      }
    </button>

    <!-- Date / Appointment -->
    <button
      type="button"
      [class]="'type-btn' + (selectedType() === OptionType.Date ? ' type-btn--selected' : '') + (layout() === 'grid' ? ' type-btn--grid' : '')"
      data-testid="type-btn-date"
      (click)="typeSelected.emit(OptionType.Date)"
    >
      @if (layout() === 'grid') {
        <span class="flex items-center justify-between w-full">
          <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.Date">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="5" width="17" height="15.5" rx="3.2"></rect>
              <path d="M3.5 10h17"></path><path d="M8 3.5v3"></path><path d="M16 3.5v3"></path>
            </svg>
          </span>
          <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.Date">
            @if (selectedType() === OptionType.Date) {
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 12.5l4.5 4.5L20 5"></path>
              </svg>
            }
          </span>
        </span>
        <span>
          <span class="type-name">{{ 'project.detail.pollTypes.appointment' | translate }}</span>
          <span class="type-desc type-desc--grid">{{ 'project.detail.pollTypes.appointmentDesc' | translate }}</span>
        </span>
      } @else {
        <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.Date">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3.2"></rect>
            <path d="M3.5 10h17"></path><path d="M8 3.5v3"></path><path d="M16 3.5v3"></path>
          </svg>
        </span>
        <span class="flex flex-col flex-1 min-w-0 text-left">
          <span class="type-name">{{ 'project.detail.pollTypes.appointment' | translate }}</span>
          <span class="type-desc">{{ 'project.detail.pollTypes.appointmentDesc' | translate }}</span>
        </span>
        <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.Date">
          @if (selectedType() === OptionType.Date) {
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 12.5l4.5 4.5L20 5"></path>
            </svg>
          }
        </span>
      }
    </button>

    <!-- Rating -->
    <button
      type="button"
      [class]="'type-btn' + (selectedType() === OptionType.Rating ? ' type-btn--selected' : '') + (layout() === 'grid' ? ' type-btn--grid' : '')"
      data-testid="type-btn-rating"
      (click)="typeSelected.emit(OptionType.Rating)"
    >
      @if (layout() === 'grid') {
        <span class="flex items-center justify-between w-full">
          <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.Rating">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.8l2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.9l5.9-.8z"></path>
            </svg>
          </span>
          <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.Rating">
            @if (selectedType() === OptionType.Rating) {
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 12.5l4.5 4.5L20 5"></path>
              </svg>
            }
          </span>
        </span>
        <span>
          <span class="type-name">{{ 'project.detail.pollTypes.rating' | translate }}</span>
          <span class="type-desc type-desc--grid">{{ 'project.detail.pollTypes.ratingDesc' | translate }}</span>
        </span>
      } @else {
        <span class="type-icon" [class.type-icon--selected]="selectedType() === OptionType.Rating">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.8l2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.9l5.9-.8z"></path>
          </svg>
        </span>
        <span class="flex flex-col flex-1 min-w-0 text-left">
          <span class="type-name">{{ 'project.detail.pollTypes.rating' | translate }}</span>
          <span class="type-desc">{{ 'project.detail.pollTypes.ratingDesc' | translate }}</span>
        </span>
        <span class="type-radio" [class.type-radio--selected]="selectedType() === OptionType.Rating">
          @if (selectedType() === OptionType.Rating) {
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 12.5l4.5 4.5L20 5"></path>
            </svg>
          }
        </span>
      }
    </button>
  </div>

  <div class="flex items-start gap-[9px] mt-[18px] px-[14px] py-[13px]"
    [class]="layout() === 'grid' ? 'max-w-[940px]' : ''"
    style="border-radius:var(--radius-lg);background:rgba(255,255,255,.6);border:1px solid var(--border-hairline-soft)">
    <svg width="16" height="16" style="flex:none;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.6"></circle>
      <path d="M12 11v5.4"></path><path d="M12 7.9v.1"></path>
    </svg>
    <span style="font-size:var(--fs-caption);line-height:var(--leading-normal);color:var(--text-secondary)">
      {{ 'project.detail.pollTypes.hint' | translate }}
    </span>
  </div>
</div>
