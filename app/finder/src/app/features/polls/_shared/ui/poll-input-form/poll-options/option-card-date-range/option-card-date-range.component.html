<ds-card [accentBorder]="false" [padding]="14">
  <div class="flex flex-col gap-3">
    <div class="flex items-start gap-2">
      <div class="flex flex-1 flex-col gap-2">
        <div class="flex gap-2">
          <div class="flex flex-1 flex-col gap-1">
            <label
              class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
            >
              {{ "project.pollInput.date.startDate" | translate }}
            </label>
            <ds-input
              type="date"
              [ngModel]="startDateValue"
              (ngModelChange)="setStartDate($event)"
              [name]="'date-range-start-' + index()"
              [readonly]="readonly()"
            />
          </div>

          @if (showTime()) {
            <div class="flex flex-1 flex-col gap-1">
              <label
                class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
              >
                {{ "project.pollInput.date.startTime" | translate }}
              </label>
              <ds-input
                type="time"
                [ngModel]="startTimeValue"
                (ngModelChange)="setStartTime($event)"
                [name]="'date-range-start-time-' + index()"
                [readonly]="readonly()"
              />
            </div>
          }
        </div>

        <div class="flex gap-2">
          <div class="flex flex-1 flex-col gap-1">
            <label
              class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
            >
              {{ "project.pollInput.date.endDate" | translate }}
            </label>
            <ds-input
              type="date"
              [ngModel]="endDateValue"
              (ngModelChange)="setEndDate($event)"
              [name]="'date-range-end-' + index()"
              [readonly]="readonly()"
            />
          </div>

          @if (showTime()) {
            <div class="flex flex-1 flex-col gap-1">
              <label
                class="text-[length:var(--fs-caption)] font-bold text-[color:var(--text-secondary)]"
              >
                {{ "project.pollInput.date.endTime" | translate }}
              </label>
              <ds-input
                type="time"
                [ngModel]="endTimeValue"
                (ngModelChange)="setEndTime($event)"
                [name]="'date-range-end-time-' + index()"
                [readonly]="readonly()"
              />
            </div>
          }
        </div>

        @if (endBeforeStart()) {
          <p
            class="m-0 flex items-center gap-1 text-[length:var(--fs-caption)] text-[color:var(--color-danger,#ef4444)]"
          >
            <ds-icon name="warning" [size]="12" />
            {{
              "project.pollInput.date.endBeforeStart"
                | translate: { date: formattedStartDate() }
            }}
          </p>
        }
      </div>

      @if (canRemove()) {
        <ds-button
          [size]="32"
          variant="ghost"
          icon="close"
          (click)="remove.emit()"
        />
      }
    </div>
  </div>
</ds-card>
