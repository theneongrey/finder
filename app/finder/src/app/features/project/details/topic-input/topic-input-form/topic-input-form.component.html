<div class="tw:pb-28 tw:flex tw:flex-col tw:gap-3 tw:mx-4">
  <div class="tw:flex tw:flex-col tw:gap-1">
    <label class="tw:text-sm tw:font-semibold tw:px-1" for="question">
      {{ "project.topicInput.yesNo.question" | translate }}
    </label>
    <div
      class="tw:bg-gray-50 tw:rounded-xl tw:border tw:border-transparent tw:transition-all tw:duration-300"
    >
      <input
        pInputText
        id="question"
        name="question"
        class="tw:w-full tw:bg-transparent"
        autocomplete="off"
        [placeholder]="
          'project.topicInput.yesNo.questionPlaceholder' | translate
        "
        [ngModel]="question()"
        (ngModelChange)="questionChange.emit($event)"
      />
    </div>
  </div>

  <div class="tw:flex tw:flex-col tw:gap-1">
    <label class="tw:text-sm tw:font-semibold tw:px-1" for="description">
      {{ "project.topicInput.yesNo.description" | translate }}
    </label>
    <app-auto-resize-textarea
      name="description"
      inputId="description"
      [maxlength]="200"
      [placeholder]="
        'project.topicInput.yesNo.descriptionPlaceholder' | translate
      "
      [ngModel]="description()"
      (ngModelChange)="descriptionChange.emit($event)"
    />
  </div>

  <app-topic-options
    [titleKey]="
      optionType() === OptionType.Date
        ? 'project.topicInput.date.answerOptions'
        : 'project.topicInput.yesNo.answerOptions'
    "
    [subtitleKey]="
      optionType() === OptionType.Date
        ? 'project.topicInput.date.minOptions'
        : 'project.topicInput.yesNo.minOptions'
    "
    [optionType]="optionType()"
    [options]="options()"
    [dateOptions]="dateOptions()"
    (add)="add.emit()"
    (remove)="remove.emit($event)"
  />
</div>

<div
  class="tw:fixed tw:bottom-0 tw:left-0 tw:w-full tw:z-50 tw:bg-white/80 tw:backdrop-blur-md tw:p-4 tw:flex tw:justify-center p-fluid"
>
  <p-button
    class="tw:w-full tw:max-w-md"
    [label]="
      mode() !== 'edit'
        ? ('project.topicInput.createPoll' | translate)
        : ('project.topicInput.updatePoll' | translate)
    "
    [icon]="
      mode() !== 'edit'
        ? 'fa-regular fa-paper-plane'
        : 'fa-regular fa-floppy-disk'
    "
    [disabled]="!isValid()"
    (click)="formSubmit.emit()"
  />
</div>
