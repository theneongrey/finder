<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;font-family:var(--font-body);}
.strip{display:flex;height:130px;}
.cell{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:monospace;color:var(--text-secondary);}
</style></head><body>
<div class="strip">
  <div class="cell" style="background:var(--bg-app);">app bg (cream-200)</div>
  <div class="cell" style="background:var(--bg-panel);">panel (cream-100)</div>
  <div class="cell" style="background:var(--bg-sheet);">sheet (cream-50)</div>
  <div class="cell" style="background:var(--surface-card);box-shadow:var(--shadow-card-soft);margin:20px;border-radius:16px;">card (white)</div>
</div>
</body></html>
