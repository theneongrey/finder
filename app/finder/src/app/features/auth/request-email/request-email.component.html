<form
  [formGroup]="form"
  (ngSubmit)="sendLoginMail()"
  class="tw:w-full tw:max-w-md"
>
  <div
    class="tw:bg-surface-container-lowest tw:rounded-xl tw:shadow-sm tw:p-8 tw:flex tw:flex-col tw:gap-8 tw:border tw:border-white/50"
  >
    <div class="tw:flex tw:flex-col tw:gap-3">
      <h1 class="tw:text-2xl tw:font-bold tw:text-on-surface">Sign In</h1>
      <p class="tw:text-base tw:text-on-surface-variant">
        Enter your email address to receive a login code.
      </p>
    </div>

    <div class="tw:flex tw:flex-col tw:gap-6">
      <div class="tw:flex tw:flex-col tw:gap-1">
        <label
          class="tw:text-sm tw:font-semibold tw:text-on-surface-variant tw:ml-1"
          for="email"
        >
          Email Address
        </label>
        <div class="tw:relative tw:group">
          <i
            class="pi pi-envelope tw:absolute tw:left-4 tw:top-1/2 tw:-translate-y-1/2 tw:text-outline tw:group-focus-within:text-primary tw:transition-colors"
          ></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            autofocus
            class="tw:w-full tw:pl-12 tw:pr-4 tw:py-4 tw:bg-surface-container-low tw:rounded-xl tw:border tw:border-transparent tw:focus:outline-none tw:focus:ring-2 tw:focus:ring-primary tw:focus:bg-surface-container-lowest tw:transition-all"
          />
        </div>
        @if (errorMessage()) {
          <p-message severity="error">{{ errorMessage() }}</p-message>
        }
      </div>

      <button
        pButton
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="tw:w-full tw:bg-primary-container tw:text-on-primary-container tw:py-4 tw:rounded-full tw:font-semibold tw:text-sm tw:flex tw:items-center tw:justify-center tw:gap-2 tw:hover:opacity-90 tw:active:scale-95 tw:transition-all tw:shadow-sm tw:disabled:opacity-50"
      >
        @if (isLoading()) {
          <i class="pi pi-spin pi-spinner"></i>
        }
        <span>Request Code</span>
        <i class="pi pi-arrow-right"></i>
      </button>
    </div>
  </div>
</form>
