<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..48,500;12..48,600;12..48,700;12..48,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#f4f1ec;-webkit-font-smoothing:antialiased;}
    input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;}
  </style>
</helmet>
<div style="min-height:100vh;background:#f4f1ec;display:flex;justify-content:center;font-family:'Hanken Grotesk',system-ui,sans-serif;">
  <div style="width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;">

    <div style="position:sticky;top:0;z-index:5;background:rgba(244,241,236,.9);backdrop-filter:blur(8px);padding:18px 22px 14px;display:flex;align-items:center;gap:12px;">
      <button style="border:none;background:#fff;color:#1f7a8c;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 4px rgba(20,24,28,.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div style="font-size:20px;font-weight:700;color:#1d2227;letter-spacing:-.3px;font-family:'Bricolage Grotesque',sans-serif;flex:1;min-width:0;">Terminumfrage erstellen</div>
      <div style="width:36px;height:36px;border-radius:50%;background:#d7eef0;color:#1f7a8c;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;">{{ userInitial }}</div>
    </div>

    <div style="flex:1;padding:6px 22px 24px;">

      <div style="font-size:13px;font-weight:700;color:#9b968f;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;">Deine Frage</div>
      <input value="{{ question }}" onChange="{{ onQuestionChange }}" placeholder="Wann?" style="width:100%;border:1px solid rgba(20,24,28,.1);background:#fff;border-radius:14px;padding:14px 16px;font-size:16px;font-family:inherit;color:#1d2227;"></input>

      <sc-if value="{{ showDescription }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px;">
          <span style="font-size:12px;font-weight:700;color:#9b968f;text-transform:uppercase;letter-spacing:.6px;">Beschreibung (optional)</span>
          <button onClick="{{ hideDescription }}" style="border:none;background:none;color:#a39e96;cursor:pointer;padding:2px;display:flex;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
          </button>
        </div>
        <input value="{{ description }}" onChange="{{ onDescriptionChange }}" placeholder="z. B. Hilf uns, einen Termin zu finden." style="width:100%;border:1px solid rgba(20,24,28,.1);background:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;color:#1d2227;"></input>
      </sc-if>
      <sc-if value="{{ hideDescriptionRow }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ showDescriptionField }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#1f7a8c;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-top:14px;">
          <span style="font-size:15px;line-height:1;">+</span> Beschreibung hinzufügen
        </button>
      </sc-if>

      <sc-if value="{{ showAutoClose }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px;">
          <span style="font-size:12px;font-weight:700;color:#9b968f;text-transform:uppercase;letter-spacing:.6px;">Automatisch schließen (optional)</span>
          <button onClick="{{ hideAutoClose }}" style="border:none;background:none;color:#a39e96;cursor:pointer;padding:2px;display:flex;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
          </button>
        </div>
        <div style="display:flex;gap:8px;">
          <input type="date" value="{{ autoCloseDate }}" onChange="{{ onAutoCloseDateChange }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.1);background:#fff;border-radius:12px;padding:11px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input>
          <input type="time" value="{{ autoCloseTime }}" onChange="{{ onAutoCloseTimeChange }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.1);background:#fff;border-radius:12px;padding:11px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input>
        </div>
      </sc-if>
      <sc-if value="{{ hideAutoCloseRow }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ showAutoCloseField }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#1f7a8c;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-top:10px;">
          <span style="font-size:15px;line-height:1;">+</span> Automatischen Abschluss festlegen
        </button>
      </sc-if>

      <div style="font-size:13px;font-weight:700;color:#9b968f;text-transform:uppercase;letter-spacing:.6px;margin:22px 0 9px;">Art der Terminoptionen</div>

      <sc-if value="{{ showTypeGrid }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;">
          <sc-if value="{{ typeIsWeekday }}" hint-placeholder-val="{{ false }}"><button style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid #1f7a8c;background:#e7f2f3;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"></path><path d="M3 12.9V12a9 9 0 0 1 15-6.7l3 2.8"></path><path d="M7 21.9l-4-4 4-4"></path><path d="M21 11.1V12a9 9 0 0 1-15 6.7l-3-2.8"></path></svg><span style="font-size:12px;font-weight:700;color:#1f7a8c;text-align:center;line-height:1.2;">Wochentag</span></button></sc-if>
          <sc-if value="{{ typeNotWeekday }}" hint-placeholder-val="{{ true }}"><button onClick="{{ setTypeWeekday }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"></path><path d="M3 12.9V12a9 9 0 0 1 15-6.7l3 2.8"></path><path d="M7 21.9l-4-4 4-4"></path><path d="M21 11.1V12a9 9 0 0 1-15 6.7l-3-2.8"></path></svg><span style="font-size:12px;font-weight:600;color:#6f6b66;text-align:center;line-height:1.2;">Wochentag</span></button></sc-if>

          <sc-if value="{{ typeIsDate }}"><button style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid #1f7a8c;background:#e7f2f3;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><circle cx="12" cy="15" r="1.8" fill="#1f7a8c" stroke="none"></circle></svg><span style="font-size:12px;font-weight:700;color:#1f7a8c;text-align:center;line-height:1.2;">Kalendertag</span></button></sc-if>
          <sc-if value="{{ typeNotDate }}" hint-placeholder-val="{{ true }}"><button onClick="{{ setTypeDate }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><circle cx="12" cy="15" r="1.8" fill="#8a8681" stroke="none"></circle></svg><span style="font-size:12px;font-weight:600;color:#6f6b66;text-align:center;line-height:1.2;">Kalendertag</span></button></sc-if>

          <sc-if value="{{ typeIsRange }}" hint-placeholder-val="{{ false }}"><button style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid #1f7a8c;background:#e7f2f3;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><line x1="7.5" y1="15" x2="16.5" y2="15" stroke-width="2.4"></line></svg><span style="font-size:12px;font-weight:700;color:#1f7a8c;text-align:center;line-height:1.2;">Datumsbereich</span></button></sc-if>
          <sc-if value="{{ typeNotRange }}" hint-placeholder-val="{{ true }}"><button onClick="{{ setTypeRange }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><line x1="7.5" y1="15" x2="16.5" y2="15" stroke-width="2.4"></line></svg><span style="font-size:12px;font-weight:600;color:#6f6b66;text-align:center;line-height:1.2;">Datumsbereich</span></button></sc-if>

          <sc-if value="{{ typeIsTime }}"><button style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid #1f7a8c;background:#e7f2f3;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span style="font-size:12px;font-weight:700;color:#1f7a8c;text-align:center;line-height:1.2;">Uhrzeit</span></button></sc-if>
          <sc-if value="{{ typeNotTime }}" hint-placeholder-val="{{ true }}"><button onClick="{{ setTypeTime }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span style="font-size:12px;font-weight:600;color:#6f6b66;text-align:center;line-height:1.2;">Uhrzeit</span></button></sc-if>

          <sc-if value="{{ typeIsTimeRange }}"><button style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid #1f7a8c;background:#e7f2f3;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="12" r="6.5"></circle><path d="M9.5 8.7V12l2 1.3"></path><path d="M17 8.3a6.5 6.5 0 0 1 0 7.4"></path><path d="M17 6.3v3.2h-3.2"></path></svg><span style="font-size:12px;font-weight:700;color:#1f7a8c;text-align:center;line-height:1.2;">Zeitspanne</span></button></sc-if>
          <sc-if value="{{ typeNotTimeRange }}" hint-placeholder-val="{{ true }}"><button onClick="{{ setTypeTimeRange }}" style="display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:13px 6px;cursor:pointer;font-family:inherit;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a8681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="12" r="6.5"></circle><path d="M9.5 8.7V12l2 1.3"></path><path d="M17 8.3a6.5 6.5 0 0 1 0 7.4"></path><path d="M17 6.3v3.2h-3.2"></path></svg><span style="font-size:12px;font-weight:600;color:#6f6b66;text-align:center;line-height:1.2;">Zeitspanne</span></button></sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ typePickerCollapsed }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openTypePicker }}" style="display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid rgba(20,24,28,.08);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;">
          <span style="width:38px;height:38px;border-radius:12px;background:#e7f2f3;color:#1f7a8c;display:flex;align-items:center;justify-content:center;flex:none;">
            <sc-if value="{{ typeIsWeekday }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"></path><path d="M3 12.9V12a9 9 0 0 1 15-6.7l3 2.8"></path><path d="M7 21.9l-4-4 4-4"></path><path d="M21 11.1V12a9 9 0 0 1-15 6.7l-3-2.8"></path></svg></sc-if>
            <sc-if value="{{ typeIsDate }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><circle cx="12" cy="15" r="1.8" fill="#1f7a8c" stroke="none"></circle></svg></sc-if>
            <sc-if value="{{ typeIsRange }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><line x1="7.5" y1="15" x2="16.5" y2="15" stroke-width="2.4"></line></svg></sc-if>
            <sc-if value="{{ typeIsTime }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></sc-if>
            <sc-if value="{{ typeIsTimeRange }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f7a8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="12" r="6.5"></circle><path d="M9.5 8.7V12l2 1.3"></path><path d="M17 8.3a6.5 6.5 0 0 1 0 7.4"></path><path d="M17 6.3v3.2h-3.2"></path></svg></sc-if>
          </span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:15px;font-weight:700;color:#1d2227;">{{ chosenTypeLabel }}</span>
          </span>
          <span style="font-size:13px;font-weight:700;color:#1f7a8c;flex:none;">Ändern</span>
        </button>
      </sc-if>

      <sc-if value="{{ typeIsChosen }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 11px;">
          <span style="font-size:13px;font-weight:700;color:#9b968f;text-transform:uppercase;letter-spacing:.6px;">Terminoptionen</span>
          <span style="font-size:12.5px;color:#a39e96;font-weight:600;">Mind. 1 Termin</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="1">
          <div style="position:relative;background:#fff;border-radius:18px;padding:16px 17px;box-shadow:0 3px 14px rgba(35,40,45,.05);border-left:4px solid #1f7a8c;">
            <sc-if value="{{ opt.canRemove }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ opt.remove }}" style="position:absolute;top:12px;right:12px;border:none;background:none;color:#a39e96;cursor:pointer;padding:4px;display:flex;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
              </button>
            </sc-if>

            <sc-if value="{{ opt.modeWeekday }}" hint-placeholder-val="{{ false }}">
              <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Wochentag</div>
              <select value="{{ opt.weekday }}" onChange="{{ opt.setWeekday }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;color:#1d2227;">
                <option value="Montag">Montag</option>
                <option value="Dienstag">Dienstag</option>
                <option value="Mittwoch">Mittwoch</option>
                <option value="Donnerstag">Donnerstag</option>
                <option value="Freitag">Freitag</option>
                <option value="Samstag">Samstag</option>
                <option value="Sonntag">Sonntag</option>
              </select>
              <sc-if value="{{ opt.hasTime }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin:11px 0 6px;">
                  <span style="font-size:12.5px;font-weight:600;color:#8a8681;">Uhrzeit</span>
                  <button onClick="{{ opt.removeTime }}" style="border:none;background:none;color:#a39e96;cursor:pointer;padding:2px;display:flex;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
                </div>
                <input type="time" value="{{ opt.time }}" onChange="{{ opt.setTime }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
              </sc-if>
              <sc-if value="{{ opt.noTime }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ opt.addTime }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#1f7a8c;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-top:10px;"><span style="font-size:14px;line-height:1;">+</span> Uhrzeit hinzufügen</button>
              </sc-if>
            </sc-if>

            <sc-if value="{{ opt.modeDate }}">
              <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Datum</div>
              <input type="date" value="{{ opt.date }}" onChange="{{ opt.setDate }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
              <sc-if value="{{ opt.hasTime }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;justify-content:space-between;margin:11px 0 6px;">
                  <span style="font-size:12.5px;font-weight:600;color:#8a8681;">Uhrzeit</span>
                  <button onClick="{{ opt.removeTime }}" style="border:none;background:none;color:#a39e96;cursor:pointer;padding:2px;display:flex;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
                </div>
                <input type="time" value="{{ opt.time }}" onChange="{{ opt.setTime }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
              </sc-if>
              <sc-if value="{{ opt.noTime }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ opt.addTime }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#1f7a8c;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-top:10px;"><span style="font-size:14px;line-height:1;">+</span> Uhrzeit hinzufügen</button>
              </sc-if>
            </sc-if>

            <sc-if value="{{ opt.modeRange }}" hint-placeholder-val="{{ true }}">
              <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Startdatum</div>
              <div style="display:flex;gap:8px;">
                <input type="date" value="{{ opt.date }}" onChange="{{ opt.setDate }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input>
                <sc-if value="{{ opt.hasTime }}" hint-placeholder-val="{{ false }}"><input type="time" value="{{ opt.time }}" onChange="{{ opt.setTime }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input></sc-if>
              </div>
              <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin:11px 0 6px;">Enddatum</div>
              <div style="display:flex;gap:8px;">
                <input type="date" value="{{ opt.endDate }}" onChange="{{ opt.setEndDate }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input>
                <sc-if value="{{ opt.hasTime }}" hint-placeholder-val="{{ false }}"><input type="time" value="{{ opt.endTime }}" onChange="{{ opt.setEndTime }}" style="flex:1;min-width:0;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:#1d2227;"></input></sc-if>
              </div>
              <sc-if value="{{ opt.hasTime }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ opt.removeTime }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#8a8681;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-top:10px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg> Uhrzeit entfernen</button>
              </sc-if>
              <sc-if value="{{ opt.noTime }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ opt.addTime }}" style="display:flex;align-items:center;gap:5px;border:none;background:none;color:#1f7a8c;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-top:10px;"><span style="font-size:14px;line-height:1;">+</span> Uhrzeit hinzufügen</button>
              </sc-if>
            </sc-if>

            <sc-if value="{{ opt.modeTimeOnly }}">
              <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Uhrzeit</div>
              <input type="time" value="{{ opt.time }}" onChange="{{ opt.setTime }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
            </sc-if>

            <sc-if value="{{ opt.modeTimeRange }}">
              <div style="display:flex;gap:8px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Startzeit</div>
                  <input type="time" value="{{ opt.time }}" onChange="{{ opt.setTime }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12.5px;font-weight:600;color:#8a8681;margin-bottom:6px;">Endzeit</div>
                  <input type="time" value="{{ opt.endTime }}" onChange="{{ opt.setEndTime }}" style="width:100%;border:1px solid rgba(20,24,28,.12);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;color:#1d2227;"></input>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <button onClick="{{ addOption }}" style="width:100%;border:1.5px dashed #9fc2cf;background:rgba(231,242,243,.5);border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-family:inherit;color:#1f7a8c;font-size:14.5px;font-weight:700;">
          <span style="width:24px;height:24px;border-radius:50%;background:#d7eef0;color:#1f7a8c;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;line-height:1;">+</span>
          Termin hinzufügen
        </button>
        </div>
      </sc-if>

    </div>

    <div style="position:sticky;bottom:0;background:linear-gradient(180deg,rgba(244,241,236,0),#f4f1ec 26%);padding:16px 22px 22px;">
      <button style="width:100%;border:none;background:#1f7a8c;color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:15px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 18px rgba(31,122,140,.28);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 12L21 3l-6 18-4.5-7.5L2.5 12z"></path></svg>
        Terminumfrage erstellen
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 480, &quot;height&quot;: 1000 },
  &quot;userName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Giovanni&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
let uid = 0;
function blankOption() {
  uid += 1;
  return {
    id: uid,
    weekday: 'Montag', date: '', time: '', endDate: '', endTime: '', hasTime: false,
  };
}

const TYPE_META = {
  weekday: { label: 'Wochentag' },
  date: { label: 'Kalendertag' },
  range: { label: 'Datumsbereich' },
  time: { label: 'Uhrzeit' },
  timerange: { label: 'Zeitspanne' },
};



class Component extends DCLogic {
  state = {
    question: '',
    description: '',
    showDescription: false,
    type: null,
    options: [],
    typePickerOpen: true,
    showAutoClose: false,
    autoCloseDate: '',
    autoCloseTime: '',
  };

  renderVals() {
    const type = this.state.type;
    const opts = this.state.options;
    const isDateBased = type === 'weekday' || type === 'date' || type === 'range';

    const options = opts.map((o, i) => ({
      ...o,
      canRemove: opts.length > 1,
      noTime: !o.hasTime,
      remove: () => this.setState(s => ({ options: s.options.filter((_, j) => j !== i) })),
      setWeekday: (e) => this.updateOption(i, { weekday: e.target.value }),
      setDate: (e) => this.updateOption(i, { date: e.target.value }),
      setTime: (e) => this.updateOption(i, { time: e.target.value }),
      setEndDate: (e) => this.updateOption(i, { endDate: e.target.value }),
      setEndTime: (e) => this.updateOption(i, { endTime: e.target.value }),
      addTime: () => this.updateOption(i, { hasTime: true }),
      removeTime: () => this.updateOption(i, { hasTime: false, time: '', endTime: '' }),
      modeWeekday: type === 'weekday',
      modeDate: type === 'date',
      modeRange: type === 'range',
      modeTimeOnly: type === 'time',
      modeTimeRange: type === 'timerange',
    }));

    return {
      userInitial: (this.props.userName || 'Giovanni').charAt(0).toUpperCase(),
      question: this.state.question,
      onQuestionChange: (e) => this.setState({ question: e.target.value }),
      description: this.state.description,
      onDescriptionChange: (e) => this.setState({ description: e.target.value }),
      showDescription: this.state.showDescription,
      hideDescriptionRow: !this.state.showDescription,
      showDescriptionField: () => this.setState({ showDescription: true }),
      hideDescription: () => this.setState({ showDescription: false, description: '' }),

      showAutoClose: this.state.showAutoClose,
      hideAutoCloseRow: !this.state.showAutoClose,
      showAutoCloseField: () => this.setState({ showAutoClose: true }),
      hideAutoClose: () => this.setState({ showAutoClose: false, autoCloseDate: '', autoCloseTime: '' }),
      autoCloseDate: this.state.autoCloseDate,
      autoCloseTime: this.state.autoCloseTime,
      onAutoCloseDateChange: (e) => this.setState({ autoCloseDate: e.target.value }),
      onAutoCloseTimeChange: (e) => this.setState({ autoCloseTime: e.target.value }),

      typeIsWeekday: type === 'weekday', typeNotWeekday: type !== 'weekday',
      typeIsDate: type === 'date', typeNotDate: type !== 'date',
      typeIsRange: type === 'range', typeNotRange: type !== 'range',
      typeIsTime: type === 'time', typeNotTime: type !== 'time',
      typeIsTimeRange: type === 'timerange', typeNotTimeRange: type !== 'timerange',
      setTypeWeekday: () => this.setType('weekday'),
      setTypeDate: () => this.setType('date'),
      setTypeRange: () => this.setType('range'),
      setTypeTime: () => this.setType('time'),
      setTypeTimeRange: () => this.setType('timerange'),

      options,
      addOption: () => this.setState(s => ({ options: [...s.options, blankOption()] })),

      typeIsChosen: !!type,
      showTypeGrid: this.state.typePickerOpen && !type,
      typePickerCollapsed: !this.state.typePickerOpen && !!type,
      openTypePicker: () => this.setState({ typePickerOpen: true }),
      chosenTypeLabel: type ? TYPE_META[type].label : '',
    };
  }

  setType(type) {
    this.setState({ type, options: [blankOption()], typePickerOpen: false });
  }

  updateOption(index, patch) {
    this.setState(s => ({
      options: s.options.map((o, i) => (i === index ? { ...o, ...patch } : o)),
    }));
  }
}
</script>
</body>
</html>
