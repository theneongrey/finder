<div hlmToggleGroup type="single" [value]="value()" (valueChange)="onValueChange($event)" class="ds-seg-track">
  @for (opt of options(); track opt.value) {
    <button
      hlmToggleGroupItem
      [value]="opt.value"
      [style.padding]="size() === 'sm' ? '8px 4px' : '9px 8px'"
      [style.font-size]="size() === 'sm' ? 'var(--fs-caption)' : 'var(--fs-ui-sm)'"
      class="ds-seg-btn"
    >{{ opt.label }}</button>
  }
</div>
