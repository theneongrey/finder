<h2 class="mb-0">
  {{ "project.pollsTab.title" | translate }}
</h2>
<p class="opacity-60 mt-1 mb-6">
  {{ "project.pollsTab.subtitle" | translate }}
</p>

<div class="grid gap-4 grid-cols-auto-fit pb-8">
  @for (poll of standalonePolls(); track poll.pollId) {
    <app-poll-item
      [poll]="poll"
      [standalone]="true"
      (deletionRequested)="deletionRequested.emit(poll)"
      (shareRequested)="shareRequested.emit(poll.projectId)"
    />
  }
  <app-add-card
    [cto]="'project.standaloneInput.addNew.cto' | translate"
    [description]="'project.standaloneInput.addNew.description' | translate"
    (action)="navigateToAdd()"
  />
</div>
