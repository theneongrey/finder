<div class="flex flex-col w-full">
  <app-title-bar />
  <main class="flex-grow max-w-5xl mx-auto w-full rounded-t-2xl px-[22px] pt-5">
    <app-standalone-poll-tab
      (deletionRequested)="pollDeletionRequested($event)"
      (shareRequested)="pollShareRequested($event)"
    />
  </main>
</div>

<hlm-alert-dialog [state]="confirmDialogOpen() ? 'open' : 'closed'" (stateChanged)="confirmDialogOpen.set($event === 'open')">
  <hlm-alert-dialog-content *hlmAlertDialogPortal>
    <hlm-alert-dialog-header>
      <h2 hlmAlertDialogTitle>{{ confirmTitle() }}</h2>
      <p hlmAlertDialogDescription>{{ confirmMessage() }}</p>
    </hlm-alert-dialog-header>
    <hlm-alert-dialog-footer>
      <button hlmAlertDialogCancel>{{ 'project.common.cancel' | translate }}</button>
      <button hlmAlertDialogAction (click)="onConfirmAccept()">{{ confirmAcceptLabel() }}</button>
    </hlm-alert-dialog-footer>
  </hlm-alert-dialog-content>
</hlm-alert-dialog>

@if (sharingProject(); as project) {
  <app-share-drawer
    [projectId]="project.projectId"
    [projectName]="project.projectName"
    [sharedWith]="project.sharedWith"
    [visibilityType]="project.visibilityType"
    [visible]="!!sharingProjectId()"
    (visibleChange)="shareDrawerVisibilityChanged($event)"
  />
}
