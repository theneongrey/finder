@let _poll = poll();

<p-card>
  <div class="flex items-start justify-between mb-4 gap-3">
    <div>
      <app-option-type-icon [type]="_poll.optionType" />
    </div>
    <div class="flex flex-col flex-1">
      <h3>{{ _poll.name }}</h3>
      @if (_poll.description) {
        <p class="ds-body mt-1">{{ _poll.description }}</p>
      }
      <div class="flex items-center gap-3 mt-2">
        <span
          [hlmTooltip]="'project.detail.item.options' | translate: { count: _poll.optionCount }"
          position="top"
          class="flex items-center gap-1 ds-body cursor-default"
        >
          <i class="fa-solid fa-list"></i>
          <span>{{ _poll.optionCount }}</span>
        </span>
        <p-button
          [text]="true"
          size="small"
          icon="fa-regular fa-comments"
          [label]="_poll.commentCount.toString()"
          [hlmTooltip]="'project.detail.item.comments' | translate: { count: _poll.commentCount }"
          position="top"
          [routerLink]="[
            '/project/detail',
            _poll.projectId,
            _poll.nextOpenOptionId ? 'poll-overview' : 'results',
            _poll.pollId,
          ]"
          fragment="comments-section"
        />
      </div>
    </div>
    @if (showMenu()) {
      <div>
        <p-button
          icon="fa-solid fa-ellipsis-vertical"
          [text]="true"
          data-testid="poll-menu-btn"
          [hlmDropdownMenuTrigger]="pollMenu"
        />
        <ng-template #pollMenu>
          <hlm-dropdown-menu>
            @if (editRoute()) {
              <button hlmDropdownMenuItem [routerLink]="editRoute()">
                <i class="fa-solid fa-pen mr-2"></i>{{ editLabel() }}
              </button>
            }
            @if (canSharePoll()) {
              <button hlmDropdownMenuItem (click)="shareRequested.emit()">
                <i class="fa-solid fa-share-nodes mr-2"></i>{{ shareLabel() }}
              </button>
            }
            <button hlmDropdownMenuItem (click)="deletionRequested.emit()">
              <i class="fa-regular fa-trash-can mr-2"></i>{{ deleteLabel() }}
            </button>
          </hlm-dropdown-menu>
        </ng-template>
      </div>
    }
  </div>

  <div class="flex flex-col gap-1">
    @if (_poll.nextOpenOptionId) {
      <p-button
        fluid
        severity="primary"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'vote',
          _poll.pollId,
          _poll.nextOpenOptionId,
        ]"
        [label]="'project.common.vote' | translate"
      />
      <p-button
        fluid
        severity="secondary"
        size="small"
        [text]="true"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'poll-overview',
          _poll.pollId,
        ]"
        [label]="'project.detail.item.voteOverview' | translate"
      />
    } @else {
      <p-button
        fluid
        severity="primary"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'results',
          _poll.pollId,
        ]"
        [label]="'project.detail.item.pollOverview' | translate"
      />
      <p-button
        fluid
        severity="secondary"
        size="small"
        [text]="true"
        [routerLink]="[
          '/project/detail',
          _poll.projectId,
          'vote',
          _poll.pollId,
        ]"
        [queryParams]="{ revote: '1' }"
        [label]="'project.votesOverview.reVote' | translate"
      />
    }
  </div>
</p-card>
