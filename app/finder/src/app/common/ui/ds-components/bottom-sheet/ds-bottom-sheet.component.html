<hlm-sheet
    [state]="open() ? 'open' : 'closed'"
    side="bottom"
    (stateChanged)="onStateChanged($event)"
>
    <hlm-sheet-content
        *hlmSheetPortal
        class="ds-sheet-panel"
        [showCloseButton]="false"
    >
        <div
            class="mx-auto h-[4.5px] w-[38px] rounded-[3px] bg-[var(--cream-400)] lg:hidden"
            style="cursor: grab; touch-action: none"
            (pointerdown)="onHandlePointerDown($event)"
            (pointermove)="onHandlePointerMove($event)"
            (pointerup)="onHandlePointerUp()"
            (pointercancel)="onHandlePointerUp()"
        ></div>
        <div class="flex items-start gap-2.5 pb-3 lg:pt-3">
            <div class="flex-1">
                <div
                    class="[font-family:var(--font-display)] text-[length:var(--fs-display-2xs)] font-bold tracking-[var(--tracking-display-sm)] text-[var(--text-primary)]"
                >
                    {{ title() }}
                </div>
                @if (subtitle()) {
                    <div
                        class="mt-0.5 text-[length:var(--fs-ui)] text-[var(--text-tertiary)]"
                    >
                        {{ subtitle() }}
                    </div>
                }
            </div>
            <ds-button
                data-testid="sheet-close-btn"
                icon="close"
                variant="dark"
                [size]="32"
                (click)="dismissed.emit()"
            />
        </div>
        <ng-content />
    </hlm-sheet-content>
</hlm-sheet>
