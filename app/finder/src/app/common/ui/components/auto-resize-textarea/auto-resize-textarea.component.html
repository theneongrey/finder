<textarea
  hlmTextarea
  #textarea
  class="ds-ta"
  rows="1"
  [placeholder]="placeholder()"
  [attr.maxlength]="maxlength() ?? null"
  [attr.id]="inputId() ?? null"
  [style.max-height]="maxHeight()"
  [value]="textValue()"
  [disabled]="isDisabled()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>
