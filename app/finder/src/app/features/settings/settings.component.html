<div class="flex flex-col h-full w-full">
  <p-toast
    [breakpoints]="{ '920px': { width: '250px' } }"
    position="top-center"
  />
  <app-title-bar class="sticky top-0 z-10" />

  <main
    class="flex-grow w-full max-w-md mx-auto px-4 py-6 flex flex-col gap-8"
  >
    <div class="flex flex-col items-center gap-2">
      @if (user(); as currentUser) {
        <div class="rounded-full border-4 border-white ds-shadow-raised">
          <app-user-avatar [user]="currentUser" size="xlarge" />
        </div>
      }
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="flex flex-col gap-6"
    >
      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="name"
        >
          {{ "settings.name" | translate }}
        </label>
        <input
          hlmInput
          id="name"
          type="text"
          formControlName="name"
          [placeholder]="'settings.namePlaceholder' | translate"
          autocomplete="name"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="email"
        >
          {{ "settings.email" | translate }}
        </label>
        <input
          hlmInput
          id="email"
          type="email"
          formControlName="email"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          class="text-sm font-semibold text-on-surface-variant"
          for="language"
        >
          {{ "settings.language" | translate }}
        </label>
        <p-select
          id="language"
          formControlName="language"
          [options]="languages"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
      </div>

      <p-button
        class="mt-2"
        type="submit"
        [label]="'settings.save' | translate"
        icon="fa-solid fa-check"
        iconPos="right"
        [disabled]="form.invalid || isSaving()"
        [loading]="isSaving()"
        [fluid]="true"
      />
    </form>
  </main>
</div>
