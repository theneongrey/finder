<p
  class="text-xs font-semibold uppercase tracking-wide text-gray-500 mt-4 mb-2"
>
  {{ "project.share.invite" | translate }}
</p>

<div class="flex gap-2">
  @if (contacts().length > 0) {
    <p-select
      fluid
      [editable]="true"
      [options]="contacts()"
      [ngModel]="contactEmail()"
      (ngModelChange)="contactEmail.set($event)"
      optionLabel="email"
      optionValue="email"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [disabled]="sharingInProgress()"
      class="flex-1"
    >
      <ng-template #item let-contact>
        <div class="flex items-center gap-2">
          <p-avatar
            [image]="contact.picture ?? undefined"
            [label]="
              contact.picture ? undefined : contact.name[0].toUpperCase()
            "
            shape="circle"
          />
          <div>
            <div class="font-medium text-sm">{{ contact.name }}</div>
            <div class="text-xs text-gray-500">{{ contact.email }}</div>
          </div>
        </div>
      </ng-template>
    </p-select>
  } @else {
    <input
      hlmInput
      type="email"
      autocomplete="off"
      [ngModel]="contactEmail()"
      (ngModelChange)="contactEmail.set($event)"
      [placeholder]="'project.share.nameOrEmail' | translate"
      [disabled]="sharingInProgress()"
      class="flex-1"
    />
  }
  <p-button
    icon="pi pi-send"
    [loading]="sharingInProgress()"
    [disabled]="!contactEmail()"
    (click)="invite()"
  />
</div>

<p-select-button
  fluid
  [allowEmpty]="false"
  [options]="roleOptions()"
  [ngModel]="selectedRole()"
  (ngModelChange)="selectedRole.set($event)"
  optionLabel="label"
  optionValue="id"
  class="mt-4"
/>

<p class="text-sm text-gray-500 mt-2">
  {{ selectedRoleDescription() }}
</p>
