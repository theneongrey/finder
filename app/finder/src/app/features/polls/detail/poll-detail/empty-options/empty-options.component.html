<div
    class="flex flex-col items-center rounded-[20px] border-[1.5px] border-dashed border-[color:var(--border-hairline)] bg-white px-6 py-14 text-center transition-colors lg:py-16"
    [class.cursor-pointer]="interactive()"
    [class.hover:border-[var(--accent)]]="interactive()"
    [attr.role]="interactive() ? 'button' : null"
    [attr.tabindex]="interactive() ? 0 : null"
    data-testid="results-empty-options"
    (click)="onCardClick()"
    (keydown.enter)="onCardClick()"
    (keydown.space)="$event.preventDefault(); onCardClick()"
>
    <!-- Plus emblem with soft glow -->
    <div class="relative mb-7 h-[84px] w-[84px]">
        <div
            class="pointer-events-none absolute inset-0 scale-[1.6] bg-[radial-gradient(ellipse,rgba(207,230,232,0.7)_0%,transparent_70%)]"
        ></div>
        <div
            class="absolute inset-0 flex items-center justify-center rounded-full bg-[var(--accent)] shadow-[0_6px_18px_rgba(31,122,140,0.35)]"
        >
            <ds-icon name="plus" [size]="34" color="#fff" />
        </div>
    </div>

    <!-- Heading -->
    <h2
        class="font-display mb-2.5 text-[22px] font-bold tracking-[-0.3px] text-[color:var(--text-primary)]"
    >
        {{ 'project.results.emptyOptionsHeading' | translate }}
    </h2>

    <!-- Description -->
    <p
        class="max-w-[360px] text-[15px] leading-[1.55] text-[color:var(--text-secondary)]"
        [class.mb-7]="canManage() && !isClosed()"
    >
        @if (canManage() && !isClosed()) {
            {{ 'project.results.emptyOptionsText' | translate }}
        } @else {
            {{ 'project.results.emptyOptionsTextVoter' | translate }}
        }
    </p>

    <!-- CTA (managers, open polls only) -->
    @if (canManage() && !isClosed()) {
        <ds-button
            variant="primary"
            [noGlow]="true"
            icon="plus"
            data-testid="empty-options-add-btn"
            (click)="$event.stopPropagation(); addOption.emit()"
        >
            {{ 'project.results.addOption' | translate }}
        </ds-button>
    }
</div>
