<button
  hlmBtn
  [disabled]="disabled() || loading()"
  [style.width]="fullWidth() ? '100%' : undefined"
  [class]="variantClass()"
  class="ds-btn"
>
  @if (loading()) {
    <span class="ds-btn__spinner"></span>
  } @else if (icon()) {
    <ds-icon [name]="icon()!" [size]="iconSize()" />
  }
  <ng-content />
  @if (!loading() && trailingIcon()) {
    <ds-icon [name]="trailingIcon()!" [size]="iconSize()" />
  }
</button>
