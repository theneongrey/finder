<div
  class="tw:flex-1 tw:bg-surface-100 tw:flex tw:items-center tw:justify-center tw:overflow-hidden"
>
  <img [src]="previewImageUrl()" alt="" class="tw:w-full tw:h-full tw:object-cover" />
</div>

<div class="tw:p-6 tw:flex-shrink-0 tw:flex tw:flex-col tw:gap-1">
  <p class="tw:text-base tw:font-semibold tw:text-surface-900 tw:leading-snug">
    {{ text() }}
  </p>
  @if (description()) {
    <p class="tw:text-sm tw:text-surface-500">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <a [href]="link()" target="_blank" rel="noopener noreferrer">
      <p-button label="Link öffnen" icon="fa-solid fa-arrow-up-right-from-square" size="small" variant="outlined" />
    </a>
  }
</div>
