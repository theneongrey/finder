<!-- @dsCard group="Colors" viewport="700x150" subtitle="Positive/open, negative/no, warning/standalone" name="Semantic status" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;display:flex;gap:14px;}
.grp{flex:1;display:flex;flex-direction:column;gap:6px;}
.sw{height:36px;border-radius:9px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;font-family:monospace;}
</style></head><body>
<div class="grp">
  <div class="sw" style="background:var(--green-900);color:#fff;">--green-900</div>
  <div class="sw" style="background:var(--green-700);color:#fff;">--green-700</div>
  <div class="sw" style="background:var(--green-badge-bg);color:var(--green-badge-fg);">badge bg/fg</div>
</div>
<div class="grp">
  <div class="sw" style="background:var(--red-900);color:#fff;">--red-900</div>
  <div class="sw" style="background:var(--red-700);color:#fff;">--red-700</div>
  <div class="sw" style="background:var(--red-100);color:var(--red-900);">--red-100</div>
</div>
<div class="grp">
  <div class="sw" style="background:var(--amber-900);color:#fff;">--amber-900</div>
  <div class="sw" style="background:var(--amber-100);color:var(--amber-900);">--amber-100</div>
  <div class="sw" style="background:var(--amber-avatar-bg);color:var(--amber-avatar-fg);">avatar bg/fg</div>
</div>
</body></html>
