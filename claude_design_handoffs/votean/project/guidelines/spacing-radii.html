<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Corner radii, from inputs to full cards" name="Corner radii" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;display:flex;gap:12px;align-items:flex-end;}
.box{width:60px;height:60px;background:var(--accent-tint);border:1.5px solid var(--accent);display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-family:monospace;color:var(--accent);padding-bottom:4px;}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm);">sm 12</div>
<div class="box" style="border-radius:var(--radius-lg);">lg 16</div>
<div class="box" style="border-radius:var(--radius-2xl);">2xl 20</div>
<div class="box" style="border-radius:var(--radius-4xl);">4xl 26</div>
<div class="box" style="border-radius:var(--radius-circle);">circle</div>
<div class="box" style="border-radius:var(--radius-pill);width:90px;">pill</div>
</body></html>
