<div class="flex flex-col justify-center gap-3 flex-1 p-6 md:p-9">
  <p class="text-center leading-snug text-wrap-pretty font-[family-name:var(--font-display)] text-[length:var(--fs-display-sm)] font-bold text-[var(--text-primary)] tracking-[-0.5px]">
    {{ text() }}
  </p>
  @if (description()) {
    <p class="text-center text-wrap-pretty text-[length:var(--fs-body)] leading-[1.45] text-[var(--text-secondary)]">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <ds-button variant="outline" icon="link" size="sm" class="self-center mt-1" (click)="openLink(link())">
      {{ linkLabel() }}
    </ds-button>
  }
</div>
