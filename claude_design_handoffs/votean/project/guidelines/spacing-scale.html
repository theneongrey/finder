<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Layout spacing scale, 2px–48px" name="Spacing scale" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:#fff;}
.row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.bar{background:var(--accent);height:14px;border-radius:3px;}
label{font-size:11px;font-family:monospace;color:var(--text-muted);width:70px;}
</style></head><body>
<div class="row"><label>4px</label><div class="bar" style="width:4px;"></div></div>
<div class="row"><label>8px</label><div class="bar" style="width:8px;"></div></div>
<div class="row"><label>12px</label><div class="bar" style="width:12px;"></div></div>
<div class="row"><label>16px</label><div class="bar" style="width:16px;"></div></div>
<div class="row"><label>20px</label><div class="bar" style="width:20px;"></div></div>
<div class="row"><label>24px</label><div class="bar" style="width:24px;"></div></div>
<div class="row"><label>32px</label><div class="bar" style="width:32px;"></div></div>
<div class="row"><label>48px</label><div class="bar" style="width:48px;"></div></div>
</body></html>
