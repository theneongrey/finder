<div>
  @if (!hideResults()) {
    <div class="tw:flex tw:justify-between tw:items-end tw:mb-3">
      <h3>{{ "project.votesOverview.candidates" | translate }}</h3>
      <p class="ds-body">
        {{ "project.votesOverview.sortedByPopularity" | translate }}
      </p>
    </div>
  }

  <div class="tw:grid tw:grid-cols-1 tw:gap-4">
    @for (option of sortedOptions(); track option.id) {
      @if (optionType() === OptionType.Date) {
        <app-option-card-date
          [option]="option"
          [isMostVoted]="hasMostVotes(option)"
          [projectId]="projectId()"
          [pollId]="pollId()"
          [hideResults]="hideResults()"
        />
      } @else if (optionType() === OptionType.Rating) {
        <app-option-card-rating
          [option]="option"
          [isMostVoted]="hasMostVotes(option)"
          [projectId]="projectId()"
          [pollId]="pollId()"
          [hideResults]="hideResults()"
        />
      } @else {
        <app-option-card
          [option]="option"
          [isMostVoted]="hasMostVotes(option)"
          [projectId]="projectId()"
          [pollId]="pollId()"
          [hideResults]="hideResults()"
        />
      }
    }
  </div>
</div>
