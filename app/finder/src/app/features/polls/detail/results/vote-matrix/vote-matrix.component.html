<div
  class="rounded-[22px] p-5"
  style="background: var(--surface-card); border: 1px solid var(--border-hairline-soft); box-shadow: var(--shadow-card-soft)"
>
  <!-- Header -->
  <div class="flex items-center justify-between gap-3 mb-4">
    <h3
      class="text-[18px] font-bold"
      style="letter-spacing: -0.3px; color: var(--text-primary)"
    >
      Wer hat was gestimmt
    </h3>
    <div class="flex items-center gap-3">
      @for (l of legend(); track l.label) {
        <span class="inline-flex items-center gap-1.5 text-[12px] font-semibold" style="color: var(--text-secondary)">
          <span class="w-3 h-3 rounded-[4px]" [style.background]="l.bg"></span>
          {{ l.label }}
        </span>
      }
    </div>
  </div>

  <!-- Grid -->
  <div class="overflow-x-auto">
    <!-- Person header row -->
    <div class="flex items-center gap-1.5" style="padding-left: 306px; min-width: max-content">
      @for (p of people(); track p.name) {
        <span
          class="flex-none flex flex-col items-center gap-1"
          style="width: 46px"
          [title]="p.name"
        >
          <span
            class="w-[30px] h-[30px] rounded-full flex items-center justify-center text-[12px] font-bold"
            style="background: var(--person-1-bg); color: var(--person-1-fg)"
          >{{ p.initial }}</span>
          <span
            class="text-[11px] text-center truncate w-full"
            style="color: var(--text-secondary); max-width: 46px"
          >{{ p.name }}</span>
        </span>
      }
    </div>

    <!-- Option rows -->
    <div class="flex flex-col gap-1.5 mt-2.5" style="min-width: max-content">
      @for (row of rows(); track row.label; let i = $index) {
        <div
          class="flex items-center gap-1.5 rounded-xl"
          style="height: 40px"
          [style.background]="row.isEven ? 'rgba(255,255,255,.75)' : 'transparent'"
        >
          <span
            class="flex-none text-[13.5px] font-semibold px-3"
            style="width: 300px; color: #3a3833"
          >{{ row.label }}</span>
          @for (cell of row.cells; track $index) {
            <span
              class="flex-none flex items-center justify-center rounded-[9px] text-[13px] font-bold"
              style="width: 46px; height: 32px"
              [style.background]="cell.bg"
              [style.color]="cell.fg"
            >{{ cell.mark }}</span>
          }
        </div>
      }
    </div>
  </div>
</div>
