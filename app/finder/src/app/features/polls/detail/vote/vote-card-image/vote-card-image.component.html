<div class="flex-1 flex items-center justify-center overflow-hidden bg-[var(--bg-panel)] border-b border-[var(--border-hairline-soft)]">
  <img [src]="imageUrl()" alt="preview-image" class="w-full h-full object-cover" draggable="false" />
</div>

<div class="flex flex-col gap-2 p-5">
  <p class="leading-snug text-[length:var(--fs-body-sm)] font-[var(--weight-semibold)] text-[var(--text-primary)]">
    {{ text() }}
  </p>
  @if (description()) {
    <p class="text-[length:var(--fs-body-xs)] text-[var(--text-secondary)]">
      {{ description() }}
    </p>
  }
  @if (link()) {
    <ds-button variant="outline" icon="link" size="sm" (click)="openLink(link())">
      {{ linkLabel() }}
    </ds-button>
  }
</div>
