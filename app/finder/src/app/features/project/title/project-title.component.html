<header
  class="main-bg-content tw:max-w-5xl tw:mx-auto tw:w-full tw:flex tw:h-01 tw:p-2"
>
  <a href="/" class="tw:my-auto">
    <img
      alt="logo"
      ngSrc="logo-white.svg"
      width="165"
      height="33"
      class="tw:mx-auto tw:mt-auto"
    />
  </a>

  <p-button
    class="tw:my-auto tw:mr-0 tw:ml-auto"
    icon="pi pi-sign-out"
    [routerLink]="['/auth/logout']"
    pTooltip="logout"
  />
</header>
