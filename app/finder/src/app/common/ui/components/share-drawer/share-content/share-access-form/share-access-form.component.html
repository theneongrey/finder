<p-toast position="top-center" />

<p
  class="text-xs font-semibold uppercase tracking-wide text-gray-500 mt-4 mb-2"
>
  {{ "project.share.tabAccess" | translate }}
</p>

<p-select-button
  fluid
  [allowEmpty]="false"
  [options]="visibilityOptions()"
  [ngModel]="selectedVisibility()"
  (ngModelChange)="onVisibilityChange($event)"
  optionLabel="label"
  optionValue="value"
  class="w-full"
/>
<p class="text-sm text-gray-500 mt-2 mb-2">
  @if (isPublic()) {
    {{ "project.share.openDescription" | translate }}
  } @else {
    {{ "project.share.inviteOnlyDescription" | translate }}
  }
</p>

@if (isPublic()) {
  <div
    class="flex items-center gap-2 bg-primary/8 p-2 rounded-md"
  >
    <span
      class="flex-1 text-sm text-gray-700 break-all select-all cursor-text"
      >{{ shareLink() }}</span
    >
    <p-button
      icon="pi pi-copy"
      [label]="'project.share.copy' | translate"
      size="small"
      (click)="copyLink()"
    />
  </div>
}
