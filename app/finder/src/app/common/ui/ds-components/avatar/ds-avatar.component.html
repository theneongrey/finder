<div class="ds-avatar-wrap">
  <hlm-avatar
    class="ds-avatar-circle"
    [style.width.px]="px()"
    [style.height.px]="px()"
    [style.min-width.px]="px()"
    [class.ds-avatar-pending]="isPending()"
    [class.ds-avatar-ring]="!isPending()"
  >
    <span
      hlmAvatarFallback
      class="ds-avatar-fallback"
      [style.background]="isPending() ? 'var(--cream-50)' : bg()"
      [style.color]="isPending() ? 'var(--sand-500)' : fg()"
      [style.font-size.px]="fontSize()"
    >{{ initial() }}</span>
  </hlm-avatar>
  @if (voted() === true) {
    <span class="ds-avatar-badge">
      <ds-icon name="check" [size]="7" color="#fff" />
    </span>
  }
</div>
