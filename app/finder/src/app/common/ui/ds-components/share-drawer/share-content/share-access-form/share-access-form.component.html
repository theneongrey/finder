<p class="label mb-2">{{ 'project.share.whoCanJoin' | translate }}</p>

<ds-segmented-control
  [options]="visibilityOptions()"
  [value]="selectedVisibility()"
  (valueChange)="visibilityChange.emit($event)"
/>

<div class="mt-3 rounded-[var(--radius-xl)] bg-[var(--sand-100)] p-3">
  @if (isPublic()) {
    <p class="text-sm text-[var(--text-secondary)]">{{ 'project.share.linkNote' | translate }}</p>
    <div class="mt-2 flex items-center gap-2">
      <span class="flex-1 select-all cursor-text break-all font-mono text-xs text-[var(--text-muted)]">{{ shareLink() }}</span>
      <ds-button variant="dark" size="sm" (click)="copyLink()">{{ 'project.share.copy' | translate }}</ds-button>
    </div>
  } @else {
    <p class="text-sm text-[var(--text-secondary)]">{{ 'project.share.inviteOnlyDescription' | translate }}</p>
  }
</div>
