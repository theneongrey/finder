<div class="mt-[15px] pt-[14px] [border-top:1px_solid_var(--border-hairline)]">
    <div class="flex items-center justify-between gap-[10px]">
        <span
            data-testid="voted-count"
            class="leading-none font-bold text-[var(--fs-ui-sm)] text-[var(--text-primary)]"
        >
            {{
                'project.lastVote.voted'
                    | translate
                        : { count: votedCount(), total: totalParticipants() }
            }}
        </span>
        <span
            class="leading-none font-semibold text-[var(--fs-caption)] text-[var(--text-muted)]"
        >
            {{ progressPercent() }}%
        </span>
    </div>
    <ds-progress-bar [percent]="progressPercent()" [height]="6" />

    @if (avatarUsers().length > 0) {
        <div class="mt-2.5 flex items-center gap-2">
            <app-avatar-stack [users]="avatarUsers()" [max]="5" size="sm" />
            <span
                class="min-w-0 flex-1 truncate text-[var(--fs-caption)] text-[var(--text-muted)]"
            >
                {{ missingVotersText() }}
            </span>
        </div>
    }
</div>
