<div class="flex gap-2">
  @for (day of weekdays; track day) {
    <div
      class="flex flex-col w-9 h-16 rounded-xl overflow-hidden border-2 border-primary/50"
    >
      <div class="h-6 flex items-center justify-center bg-white">
        <span class="text-[12px] font-bold text-primary leading-none">{{
          weekdayShortName(day)
        }}</span>
      </div>
      @if (day === entry().weekday) {
        <div class="h-px bg-primary"></div>
        <div class="flex-1 flex items-center justify-center bg-primary">
          <i class="fa-solid fa-check text-white text-xs"></i>
        </div>
      } @else if (otherWeekdays().has(day)) {
        <div class="h-px bg-primary/30"></div>
        <div class="flex-1 bg-primary/20"></div>
      } @else {
        <div class="h-px bg-surface-200"></div>
        <div class="flex-1 bg-surface-100"></div>
      }
    </div>
  }
</div>
<div class="flex items-baseline gap-2">
  <p class="text-[26px] font-semibold text-surface-900">
    {{ weekdayName(entry().weekday!) }}
  </p>
  @if (entry().startTime; as t) {
    <span class="text-surface-300">·</span>
    <p class="text-[26px] font-medium text-surface-500">{{ formatTimeOnly(t) }}</p>
  }
</div>
